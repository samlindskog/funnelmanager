[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-runtime"
version = "0.1.0"
description = "Funnel Manager shared service runtime: principal extraction, RFC 8693 token exchange, structured logging, health/metrics, anonymous-route annotations"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "prometheus-client>=0.20",
    "starlette>=0.40",
]

[tool.setuptools.packages.find]
include = ["fm_runtime*"]
