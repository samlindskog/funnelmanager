services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: ${POSTGRES_DB:-funnelmanager}
    ports:
      - "${HOST_BIND:-}5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d ${POSTGRES_DB:-funnelmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "${HOST_BIND:-}27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_BIND:-}6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data_dev:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data_dev:/var/lib/milvus
    ports:
      - "${HOST_BIND:-}19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@db:5432/${POSTGRES_DB:-funnelmanager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      leads-backend:
        condition: service_started
      auth-backend:
        condition: service_started

  leads-backend:
    build:
      context: ./leads-backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
    volumes:
      - ./leads-backend:/app
    expose:
      - "8001"
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy

  auth-backend:
    build:
      context: ./auth-backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
    volumes:
      - ./auth-backend:/app
    expose:
      - "8002"
    depends_on:
      redis:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      SEARCH_BACKEND_URL: ${SEARCH_BACKEND_URL:-http://backend:8000}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    volumes:
      - ./mcp-server:/app
    # Internal MCP endpoint (streamable HTTP at /mcp) for agents like OpenClaw.
    # Published for host-local MCP clients in dev; never routed through nginx.
    ports:
      - "${HOST_BIND:-}8003:8003"
    depends_on:
      - backend
      - leads-backend
      - auth-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
      # Set when behind a TLS reverse proxy (e.g. VITE_HMR_PROTOCOL=wss, port 443)
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend
      - leads-backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    # HOST_BIND lets a deploy pin published ports to loopback (e.g. "127.0.0.1:")
    # so a TLS reverse proxy fronts them; Docker publishes bypass ufw otherwise.
    ports:
      - "${HOST_BIND:-}5173:80"
      - "${HOST_BIND:-}8000:80"
    depends_on:
      - frontend
      - backend
      - leads-backend
      - auth-backend

volumes:
  postgres_data_dev:
  mongo_data_dev:
  redis_data_dev:
  etcd_data_dev:
  minio_data_dev:
  milvus_data_dev:
  frontend_node_modules:
