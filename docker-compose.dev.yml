services:
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: ${POSTGRES_DB:-funnelmanager}
    ports:
      - "${HOST_BIND:-}5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d ${POSTGRES_DB:-funnelmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    # WiredTiger defaults to ~50% of host RAM per mongod; pin the cache small —
    # the working set is tiny and this cache should be first to go under pressure.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 768m
    ports:
      - "${HOST_BIND:-}27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_BIND:-}6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    mem_limit: 256m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data_dev:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    mem_limit: 512m
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    # Milvus reads its cgroup limit and scales its internal watermarks to it;
    # the hard cap keeps segment caches from competing with the rest of the box.
    mem_limit: 1536m
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data_dev:/var/lib/milvus
    ports:
      - "${HOST_BIND:-}19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  search:
    build:
      context: ./search
      dockerfile: Dockerfile.dev
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@db:5432/${POSTGRES_DB:-funnelmanager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth:8002}
    volumes:
      - ./search:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      leads:
        condition: service_started
      auth:
        condition: service_started

  leads:
    build:
      context: ./leads
      dockerfile: Dockerfile.dev
    # Highest app cap: serializing enriched Apollo docs (~5MB JSON per 100
    # leads) through pydantic spikes well past idle usage.
    mem_limit: 1g
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth:8002}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
    volumes:
      - ./leads:/app
    expose:
      - "8001"
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # Authorization decision point. Runs bare — the auth backend pushes the Rego
  # policy and role-grant data into it at startup and on every role change.
  opa:
    image: openpolicyagent/opa:1.6.0
    mem_limit: 256m
    command: ["run", "--server", "--addr", "0.0.0.0:8181"]
    expose:
      - "8181"

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile.dev
    mem_limit: 256m
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      OPA_URL: ${OPA_URL:-http://opa:8181}
      # Lets the hub approve OpenClaw DM pairing requests (route registered
      # by the funnelmanager-auth plugin, authenticated with the gateway token).
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-http://openclaw:18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      WEB_APPS: ${WEB_APPS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
    volumes:
      - ./auth:/app
    expose:
      - "8002"
    depends_on:
      redis:
        condition: service_healthy
      opa:
        condition: service_started

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile.dev
    # Parses full lead payloads before summarizing for agents; give it spike room.
    mem_limit: 768m
    env_file:
      - .env
    environment:
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth:8002}
      # Dev convenience: tool calls without a session token fall back to the
      # shared AUTH_USERNAME/AUTH_PASSWORD login. Keep off in prod.
      MCP_SHARED_LOGIN_FALLBACK: ${MCP_SHARED_LOGIN_FALLBACK:-true}
    volumes:
      - ./mcp:/app
    # Internal MCP endpoint (streamable HTTP at /mcp) for agents like OpenClaw.
    # Published for host-local MCP clients in dev; never routed through nginx.
    ports:
      - "${HOST_BIND:-}8003:8003"
    depends_on:
      - leads
      - auth

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    mem_limit: 2g
    # Deliberately no env_file: OpenClaw gets only the secrets it needs, not
    # the whole stack's (.env holds Apollo/OpenAI/DB credentials).
    environment:
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Agent model: OpenAI today; Anthropic stays wired in openclaw.json for
      # when ANTHROPIC_API_KEY is available.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Config + skills are versioned in ./openclaw; runtime state (sessions,
      # agent auth, credentials) persists there too but is gitignored.
      - ./openclaw:/home/node/.openclaw
      # Auth-profile encryption keys — keep out of the repo dir entirely.
      - openclaw_auth_dev:/home/node/.config/openclaw
    # Control UI / gateway WebSocket. Reaches funnelmanager MCP at
    # http://mcp:8003/mcp over the compose network.
    ports:
      - "${HOST_BIND:-}18789:18789"
    depends_on:
      - mcp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Vite dev server + esbuild need real headroom during rebuilds.
    mem_limit: 1g
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
      # Set when behind a TLS reverse proxy (e.g. VITE_HMR_PROTOCOL=wss, port 443)
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - search
      - leads

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 128m
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    # HOST_BIND lets a deploy pin published ports to loopback (e.g. "127.0.0.1:")
    # so a TLS reverse proxy fronts them; Docker publishes bypass ufw otherwise.
    ports:
      - "${HOST_BIND:-}5173:80"
      - "${HOST_BIND:-}8000:80"
    depends_on:
      - frontend
      - search
      - leads
      - auth

volumes:
  postgres_data_dev:
  mongo_data_dev:
  redis_data_dev:
  etcd_data_dev:
  minio_data_dev:
  milvus_data_dev:
  frontend_node_modules:
  openclaw_auth_dev:
