services:
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: ${POSTGRES_DB:-funnelmanager}
    ports:
      - "${HOST_BIND:-}5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d ${POSTGRES_DB:-funnelmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    # WiredTiger defaults to ~50% of host RAM per mongod; pin the cache small —
    # the working set is tiny and this cache should be first to go under pressure.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 768m
    ports:
      - "${HOST_BIND:-}27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    mem_limit: 256m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data_dev:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    mem_limit: 512m
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data_dev:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    # Milvus reads its cgroup limit and scales its internal watermarks to it;
    # the hard cap keeps segment caches from competing with the rest of the box.
    mem_limit: 1536m
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data_dev:/var/lib/milvus
    ports:
      - "${HOST_BIND:-}19530:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  search:
    build:
      context: .
      dockerfile: search/Dockerfile.dev
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@db:5432/${POSTGRES_DB:-funnelmanager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      FM_SERVICE_NAME: search
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: search
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_SEARCH_SECRET:-dev-search-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
    volumes:
      - ./search:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      leads:
        condition: service_started
      keycloak:
        condition: service_healthy

  leads:
    build:
      context: .
      dockerfile: leads/Dockerfile.dev
    # Highest app cap: serializing enriched Apollo docs (~5MB JSON per 100
    # leads) through pydantic spikes well past idle usage.
    mem_limit: 1g
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      FM_SERVICE_NAME: leads
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: leads
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_LEADS_SECRET:-dev-leads-secret}
      # Principle-4 human-approval HMAC secret. agents MINTS approval tokens,
      # leads/mail VERIFY them for agent-initiated over-threshold actions. Same
      # value on all three or agent actions fail closed. See libs/fm_runtime/confirmation.py.
      FM_CONFIRM_APPROVAL_SECRET: ${FM_CONFIRM_APPROVAL_SECRET:-dev-approval-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
    volumes:
      - ./leads:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    expose:
      - "8001"
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # Dedicated Postgres for the mail archive — the mail service is the only
  # consumer; the shared `db` stays search-only.
  mail-db:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: funnelmanager_mail
    volumes:
      - mail_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d funnelmanager_mail"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    build:
      context: .
      dockerfile: mail/Dockerfile.dev
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@mail-db:5432/funnelmanager_mail
      FM_SERVICE_NAME: mail
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: mail
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_MAIL_SECRET:-dev-mail-secret}
      # Principle-4 human-approval HMAC secret (VERIFY side; agents mints).
      # Same value on agents/leads/mail or agent-initiated over-threshold
      # mail actions fail closed. See libs/fm_runtime/confirmation.py.
      FM_CONFIRM_APPROVAL_SECRET: ${FM_CONFIRM_APPROVAL_SECRET:-dev-approval-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Must match an authorized redirect URI on the Google OAuth client.
      OAUTH_REDIRECT_URL: ${MAIL_OAUTH_REDIRECT_URL:-http://localhost:8000/api/mail/oauth/callback}
    volumes:
      - ./mail:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    expose:
      - "8004"
    depends_on:
      mail-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Standalone mail UI (React + MUI, own app) — served same-origin at /mail/
  # behind nginx so it shares the hub's session token.
  mailui:
    build:
      context: ./mailui
      dockerfile: Dockerfile.dev
    mem_limit: 1g
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./mailui:/app
      - mailui_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - mail

  # Identity provider (sole OIDC issuer). Dev mode: H2 file storage + realm
  # import from deploy/keycloak/ (dev-only secrets — the k3s deployment uses
  # secret refs instead). The browser reaches it on localhost:8080 while
  # backends dial keycloak:8080 — token/JWKS URLs are pinned to the container
  # DNS name and the issuer string to the browser-facing origin so both see
  # consistent `iss` claims.
  keycloak:
    # Pinned to a concrete 26.2.x patch + digest (verified on quay.io). The
    # script-mapper mechanism was proven on 26.2; stay on 26.2.x. Bump both the
    # tag and the digest together.
    image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      # Backchannel requests (token exchange / JWKS from the containers) must
      # mint tokens with the SAME issuer the browser sees; a dynamic
      # backchannel hostname would stamp iss=http://keycloak:8080 and break
      # every service's pinned-issuer verification.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # Enables the fm-origin-provider script mapper (below), which propagates
      # the fm_origin claim across RFC 8693 token exchanges. 'scripts' is a
      # preview feature; start-dev auto-builds the mounted provider on startup.
      KC_FEATURES: scripts
    volumes:
      - ./deploy/keycloak/realm-funnelmanager-dev.json:/opt/keycloak/data/import/realm.json:ro
      # Script provider: carries fm_origin across every exchange hop so an
      # agent-initiated origin ("alice (via agent)") survives mcp->search->....
      - ./deploy/keycloak/providers/fm-origin-provider.jar:/opt/keycloak/providers/fm-origin-provider.jar:ro
      # No H2 named volume: a fresh named volume mounted at data/h2 is root-owned,
      # so KC (uid 1000) can't write its H2 files (AccessDenied on startup). Dev
      # re-imports the realm from the bind mount every start, so ephemeral
      # in-container H2 is correct and avoids stale-realm drift.
    ports:
      - "${HOST_BIND:-}8080:8080"
    healthcheck:
      # The KC image ships no curl/wget; poke the port with bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/funnelmanager HTTP/1.0\\r\\nHost: localhost\\r\\n\\r' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 12

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile.dev
    # Parses full lead payloads before summarizing for agents; give it spike room.
    mem_limit: 768m
    env_file:
      - .env
    environment:
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      SEARCH_BACKEND_URL: ${SEARCH_BACKEND_URL:-http://search:8000}
      JOBS_BACKEND_URL: ${JOBS_BACKEND_URL:-http://jobs:8005}
      MAIL_BACKEND_URL: ${MAIL_BACKEND_URL:-http://mail:8004}
      FM_SERVICE_NAME: mcp
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: mcp
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_MCP_SECRET:-dev-mcp-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      # Dev convenience: tokenless tool calls act as the MCP server's own
      # service identity (client credentials). Keep off in prod.
      MCP_SHARED_LOGIN_FALLBACK: ${MCP_SHARED_LOGIN_FALLBACK:-true}
    volumes:
      - ./mcp:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    # Internal MCP endpoint (streamable HTTP at /mcp) for AI-agent clients.
    # Published for host-local MCP clients in dev; never routed through nginx.
    ports:
      - "${HOST_BIND:-}8003:8003"
    depends_on:
      - leads
      - keycloak

  # Dedicated Postgres for the jobs store — the jobs service is the only
  # consumer (own db funnelmanager_jobs; follows the mail-db pattern).
  jobs-db:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: funnelmanager_jobs
    volumes:
      - jobs_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d funnelmanager_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Jobs service (:8005) — subscribes to each producer's
  # /internal/jobs/v1/stream and proxies its control API. v1 producers = search
  # + agents. Internal only: never routed through nginx;
  # published on loopback in dev for host-local inspection (prod is loopback too).
  jobs:
    build:
      context: .
      dockerfile: jobs/Dockerfile.dev
    mem_limit: 512m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@jobs-db:5432/funnelmanager_jobs
      FM_SERVICE_NAME: jobs
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: jobs
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_JOBS_SECRET:-dev-jobs-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json). The jobs service account holds the
      # jobs-internal role (reaches producers' /internal/jobs/*).
      FM_ENFORCE_GRANTS: "true"
      # Config-driven producer registry: v1 = search + agents. name=base_url;
      # name is BOTH the Job.app value and the token-exchange audience (svc
      # scopes jobs->search, jobs->agents).
      JOBS_PRODUCERS: ${JOBS_PRODUCERS:-search=http://search:8000,agents=http://agents:8006}
    volumes:
      - ./jobs:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    # Loopback publish for host-local inspection; nginx never routes to it.
    ports:
      - "${HOST_BIND:-}8005:8005"
    expose:
      - "8005"
    depends_on:
      jobs-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      search:
        condition: service_started
      agents:
        condition: service_started

  # Dedicated Postgres for the agents store — the agents service is the only
  # consumer (own db funnelmanager_agents; follows the mail-db pattern).
  agents-db:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: funnelmanager_agents
    volumes:
      - agents_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d funnelmanager_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Agents service (:8006) — runs pydantic-ai runtime agents that act
  # EXCLUSIVELY through MCP tools (agents->mcp RFC 8693 exchange, fm_origin=agent).
  # Browser-facing (nginx-routed at /api/agents like search/mail) AND a v1 job
  # producer (jobs subscribes to its /internal/jobs/v1 stream).
  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile.dev
    mem_limit: 768m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@agents-db:5432/funnelmanager_agents
      FM_SERVICE_NAME: agents
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER:-http://localhost:8080/realms/funnelmanager}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: agents
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_AGENTS_SECRET:-dev-agents-secret}
      # Principle-4 human-approval HMAC secret (MINT side). agents signs the
      # approval token a human grants out-of-band; leads/mail verify it. Same
      # value on all three or agent over-threshold actions fail closed.
      FM_CONFIRM_APPROVAL_SECRET: ${FM_CONFIRM_APPROVAL_SECRET:-dev-approval-secret}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://localhost}
      # The runtime agent's ONLY capability surface (internal MCP mount).
      MCP_URL: ${MCP_URL:-http://mcp:8003/mcp}
      # Runtime-agent LLM (OpenAI) — key shared with leads (from .env), model
      # is plain config.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTS_LLM_MODEL: ${AGENTS_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./agents:/app
      - ./libs/fm_runtime:/libs/fm_runtime
    expose:
      - "8006"
    depends_on:
      agents-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp:
        condition: service_started

  # Standalone agents UI (React + MUI, own app) — served same-origin at /agents/
  # behind nginx so it shares the hub's session token.
  agentsui:
    build:
      context: ./agentsui
      dockerfile: Dockerfile.dev
    mem_limit: 1g
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./agentsui:/app
      - agentsui_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - agents

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Vite dev server + esbuild need real headroom during rebuilds.
    mem_limit: 1g
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
      # Set when behind a TLS reverse proxy (e.g. VITE_HMR_PROTOCOL=wss, port 443)
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - search
      - leads

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 128m
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    # HOST_BIND lets a deploy pin published ports to loopback (e.g. "127.0.0.1:")
    # so a TLS reverse proxy fronts them; Docker publishes bypass ufw otherwise.
    ports:
      - "${HOST_BIND:-}5173:80"
      - "${HOST_BIND:-}8000:80"
    depends_on:
      - frontend
      - search
      - leads
      - mail
      - mailui
      - agents
      - agentsui

volumes:
  postgres_data_dev:
  mail_postgres_data_dev:
  jobs_postgres_data_dev:
  agents_postgres_data_dev:
  mongo_data_dev:
  etcd_data_dev:
  minio_data_dev:
  milvus_data_dev:
  frontend_node_modules:
  mailui_node_modules:
  agentsui_node_modules:
