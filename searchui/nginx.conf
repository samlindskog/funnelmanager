server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is built with base /search/ and always served under that prefix
    # (the main frontend nginx proxies /search/ here with the path intact).
    location = / {
        return 302 /search/;
    }

    location /search/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /search/ {
        try_files $uri $uri/ /search/index.html;
    }
}
