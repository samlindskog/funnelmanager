map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream funnel_vite {
    server frontend:5173;
}

upstream funnel_api {
    server search:8000;
}

upstream funnel_leads {
    server leads:8001;
}

upstream funnel_auth {
    server auth:8002;
}

upstream funnel_mail {
    server mail:8004;
}

upstream funnel_mailui {
    server mailui:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Apollo async webhooks → leads directly (secret-authenticated; no JWT).
    location /api/leads/webhooks/ {
        proxy_pass http://funnel_leads/api/leads/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Auth/login/session issuance → auth backend (longest-prefix wins over /api/).
    location /api/auth/ {
        proxy_pass http://funnel_auth/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Search backend routes live under /api/search/. Remaining leads routes stay internal.
    location /api/search/ {
        proxy_pass http://funnel_api/api/search/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Mail backend (Google mailbox archive + send).
    location /api/mail/ {
        proxy_pass http://funnel_mail/api/mail/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Standalone mail app (own Vite dev server, base /mail/) + its HMR.
    # /api/mail/ above still wins by longest prefix.
    location /mail/ {
        proxy_pass http://funnel_mailui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # App + Vite HMR → Vite dev server
    location / {
        proxy_pass http://funnel_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
