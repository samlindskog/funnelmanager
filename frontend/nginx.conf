server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Apollo async webhooks → leads directly (secret-authenticated; no session token).
    location /api/leads/webhooks/ {
        proxy_pass http://leads:8001/api/leads/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Auth/login/session/authorization → auth backend. The auth service's
    # /internal/* routes are deliberately NOT proxied — they stay reachable
    # only on the compose network.
    location /api/auth/ {
        proxy_pass http://auth:8002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Search backend routes live under /api/search/. Remaining leads routes stay internal.
    location /api/search/ {
        proxy_pass http://search:8000/api/search/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
