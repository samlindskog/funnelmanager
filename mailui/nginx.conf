server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is built with base /mail/ and always served under that prefix
    # (the main frontend nginx proxies /mail/ here with the path intact).
    location = / {
        return 302 /mail/;
    }

    location /mail/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /mail/ {
        try_files $uri $uri/ /mail/index.html;
    }
}
