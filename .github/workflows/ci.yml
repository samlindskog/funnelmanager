name: CI

# Fast feedback on every PR and on main. Does NOT deploy (see deploy-prod.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files parse
        run: |
          # dev compose references env_file: .env (gitignored); a stub satisfies parsing.
          touch .env
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.prod.yml config -q
