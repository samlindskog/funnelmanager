name: CI

# Fast feedback on every PR and on main. Does NOT deploy (see deploy-prod.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  mailui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mailui/package-lock.json
      - name: Install
        working-directory: mailui
        run: npm ci
      - name: Typecheck + build
        working-directory: mailui
        run: npm run build
      - name: Lint
        working-directory: mailui
        run: npm run lint

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fm_runtime + service deps, import every app
        run: |
          python -m pip install -q ./libs/fm_runtime
          python -m pip install -q -r search/requirements.txt -r leads/requirements.txt \
            -r mail/requirements.txt -r mcp/requirements.txt
          for svc in search leads mail mcp; do
            (cd "$svc" && python -c "import app.main" && echo "$svc imports OK")
          done

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: opa check + test
        run: |
          curl -sL -o opa https://openpolicyagent.org/downloads/v1.6.0/opa_linux_amd64_static
          chmod +x opa
          ./opa check --strict deploy/policy
          ./opa test deploy/policy -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build all deploy dirs
        run: |
          for dir in deploy/infrastructure/*/ deploy/apps/overlays/prod deploy/apps/overlays/dev; do
            [ -f "$dir/kustomization.yaml" ] || continue
            kubectl kustomize --load-restrictor=LoadRestrictionsNone "$dir" > /dev/null
            echo "OK $dir"
          done

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files parse
        run: |
          # dev compose references env_file: .env (gitignored); a stub satisfies parsing.
          touch .env
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.prod.yml config -q
