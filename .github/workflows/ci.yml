name: CI

# Fast feedback on every PR and on main. Does NOT deploy (see release-prod.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  mailui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mailui/package-lock.json
      - name: Install
        working-directory: mailui
        run: npm ci
      - name: Typecheck + build
        working-directory: mailui
        run: npm run build
      - name: Lint
        working-directory: mailui
        run: npm run lint

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fm_runtime + service deps, import every app
        run: |
          python -m pip install -q ./libs/fm_runtime
          python -m pip install -q -r search/requirements.txt -r leads/requirements.txt \
            -r mail/requirements.txt -r mcp/requirements.txt \
            -r jobs/requirements.txt -r agents/requirements.txt
          for svc in search leads mail mcp jobs agents; do
            (cd "$svc" && python -c "import app.main" && echo "$svc imports OK")
          done

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: opa check + test
        run: |
          curl -sL -o opa https://openpolicyagent.org/downloads/v1.6.0/opa_linux_amd64_static
          chmod +x opa
          ./opa check --strict deploy/policy
          ./opa test deploy/policy -v
      # Blocking lockstep gate (P7): code (fm_runtime grants + exchange scopes)
      # ⇔ deploy/policy/data.json (roles + azp_allow) ⇔ the Keycloak realms
      # (role/composite defs, svc-* over/under-grant, fm-origin passthrough
      # defaults). A hand-edited realm or a leftover svc-* over-grant fails the
      # build here. Runs against BOTH the dev realm and the prod example realm.
      - name: Install fm_runtime for the lockstep check
        run: python -m pip install -q ./libs/fm_runtime
      - name: grants ⇔ data.json ⇔ realm lockstep (dev + prod realms)
        run: |
          python -m fm_runtime.export --check deploy/policy/data.json \
            --realm deploy/keycloak/realm-funnelmanager-dev.json
          python -m fm_runtime.export --check deploy/policy/data.json \
            --realm deploy/keycloak/realm-funnelmanager-prod.example.json
      # The mesh require-principal notPaths is a 3rd hand-kept copy of the
      # data.json anonymous prefixes; fail if it no longer covers them.
      - name: mesh anonymous notPaths ⊇ data.json anonymous prefixes
        run: python deploy/policy/check_mesh_anonymous.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build all deploy dirs
        run: |
          for dir in deploy/infrastructure/*/ deploy/apps/overlays/prod; do
            [ -f "$dir/kustomization.yaml" ] || continue
            kubectl kustomize --load-restrictor=LoadRestrictionsNone "$dir" > /dev/null
            echo "OK $dir"
          done

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files parse
        run: |
          # dev compose references env_file: .env (gitignored); a stub satisfies parsing.
          touch .env
          docker compose -f docker-compose.dev.yml config -q
          # prod compose guards KEYCLOAK_REALM_FILE with ${...:?}; a placeholder value
          # satisfies interpolation for a parse-only check (config -q reads no files).
          KEYCLOAK_REALM_FILE=/tmp/realm.json docker compose -f docker-compose.prod.yml config -q

  keycloak-provider:
    # The fm-origin script-provider JAR + its k3s ConfigMap are CI-reproduced
    # from src/ (never hand-authored). Fail if the committed artifacts drift
    # from a fresh deterministic build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild provider JAR + ConfigMap from src/
        run: deploy/keycloak/providers/build.sh
      - name: Fail if committed artifacts differ from a fresh build
        run: |
          git diff --exit-code -- \
            deploy/keycloak/providers/fm-origin-provider.jar \
            deploy/infrastructure/identity/providers-configmap.yaml
