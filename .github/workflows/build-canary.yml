# Build a TELEMETRY-ENABLED canary image of ANY deployable service from an
# arbitrary feature branch, push it as `<service>:canary-<shortsha>`, then
# pin+activate it in that service's prod canary Deployment on main. Flux
# reconciles the commit and the canary goes live for browsers that set the
# host-only `fm_debug=<secret>` session cookie PLUS the `fm_route=canary` selector
# on x9bc433.win — the debug-session-gate EnvoyFilter validates them and injects
# the secret `x-fm-canary` token that the active canary's dedicated route matches
# (see deploy/infrastructure/gateway/canary/<svc>-canary.yaml — the per-service
# route, present only while the canary is scaled up — and
# deploy/infrastructure/mesh-policies/debug-session-gate.yaml).
# Mirrors build-images.yml's auth/login/buildx + commit-pin pattern.
#
# General over every deployed service (NOT `backup` — it's a batch job, not a
# Deployment). A SPA canary bakes the Faro RUM bootstrap into its bundle via
# `ARG VITE_TELEMETRY`; a BACKEND canary is the SAME image build as stable —
# same context/Dockerfile — just built from a feature ref and tagged
# `canary-<sha>` instead of `sha-<sha>`. Backends don't declare
# `ARG VITE_TELEMETRY`/`APP_VERSION` and just emit a harmless "unconsumed ARG"
# warning, exactly like build-images.yml already does with APP_VERSION.
#
# Armed canaries today: frontend + searchui (SPA, gateway), search (backend,
# gateway), and leads (backend, EAST-WEST). Ten services are eligible (the input
# `options:` below). To arm a NEW canary, add its THREE legs and this workflow
# drives it unchanged (the preflight+pin guards fail closed until all three land):
#   1. `deploy/apps/base/<svc>-canary/*` base manifests,
#   2. the `<svc>-canary` overlay images entry, and
#   3. the class-correct toggled route/VS file — a gateway HTTPRoute
#      (gateway/canary/<svc>-canary.yaml) or, for INTERNAL services, an east-west
#      VirtualService (mesh-policies/canary/<svc>-canary-eastwest.yaml).
#
# ROUTING TAXONOMY. How the canary marker is steered depends on the service:
#   * gateway  (frontend/searchui/mailui/agentsui/search/mail/agents) — a
#     cookie-gated gateway HTTPRoute under gateway/canary/<svc>-canary.yaml that
#     PRESENCE-matches the x-fm-canary header (regex .+, NEVER the secret),
#     toggled in the gateway kustomization (anchor `- referencegrants.yaml`). The
#     secret lives ONLY in the fm-canary-token Secret (istio-ingress) and is
#     injected at the gateway by the debug-session-gate EnvoyFilter for a valid
#     fm_debug cookie + fm_route=canary selector; the routes are secret-free,
#     exactly like the east-west VS.
#   * eastwest (leads/mcp/jobs) — INTERNAL-only: an in-mesh Istio VirtualService
#     under mesh-policies/canary/<svc>-canary-eastwest.yaml that PRESENCE-matches
#     x-fm-canary (regex .+, NEVER the secret), toggled in the mesh-policies
#     kustomization (anchor `- debug-session-gate.yaml`).
# The preflight+pin guards assert BOTH classes presence-match and that NO
# secret-looking literal is present in either route/VS (fail closed if present).
#
# ACTIVATION APPROVAL GATE (now EXISTS). The `pin` job — the one that flips
# replicas 0->1 and commits the activation — runs under the GitHub
# `canary-activation` environment, so it PAUSES for a manual reviewer approval in
# the Actions UI. Building/pushing the image (the `build` job) is unguarded; only
# ACTIVATION waits for a human click.
name: build-canary

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to build as a canary.
        required: true
        default: frontend
        type: choice
        # Every deployed service (a Deployment) can be canaried. `backup` is
        # excluded (it's a batch job, no Deployment / canary manifests). A
        # service still needs its `<svc>-canary` manifests (base + overlay
        # images entry) before the pin job will activate it.
        options:
          - frontend
          - mailui
          - agentsui
          - searchui
          - search
          - leads
          - mail
          - mcp
          - jobs
          - agents
      ref:
        description: Git branch or SHA to build the canary image from.
        required: true
        default: main
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    # FAIL CLOSED before anything is built or pushed: refuse to build a
    # `<svc>-canary` image for a service that isn't ARMED on main. The canary
    # manifests (base Deployment + overlay `<svc>-canary` images entry) are a
    # deliberate trust decision — until BOTH land on main, a canary image must
    # never reach the registry (registry-poisoning guard; also stops an
    # un-routable image that would only ImagePullBackOff). Checks out MAIN, not
    # the feature `ref`, because the manifests live on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assert canary manifests exist on main
        run: |
          set -euo pipefail
          SVC="${{ inputs.service }}"
          # ROUTING CLASS decides which toggled route artifact + gate semantics
          # apply. Keep this enumeration in sync with the `service` input options.
          case "$SVC" in
            frontend|searchui|mailui|agentsui|search|mail|agents) rc=gateway ;;
            leads|mcp|jobs) rc=eastwest ;;
            *) echo "::error::unknown service '$SVC' (no routing class)"; exit 1 ;;
          esac
          dep="deploy/apps/base/${SVC}-canary/deployment.yaml"
          overlay="deploy/apps/overlays/prod/kustomization.yaml"
          if [ ! -f "$dep" ]; then
            echo "::error::No canary base manifest for '$SVC' (expected $dep) — arm it on main first."
            exit 1
          fi
          if ! grep -q "funnelmanager/${SVC}-canary" "$overlay"; then
            echo "::error::No '${SVC}-canary' images entry in $overlay — arm it on main first."
            exit 1
          fi
          # The secret is NO LONGER derivable from git — it lives only in the
          # fm-canary-token Secret (istio-ingress) and is injected at the gateway.
          # Both classes therefore PRESENCE-match x-fm-canary and must contain NO
          # secret-looking literal (a 32-hex token would be a leaked/stale secret).
          if [ "$rc" = gateway ]; then
            # GATEWAY: the cookie-marked route lives in its own toggled HTTPRoute
            # (canary-if-exists-else-stable). It must PRESENCE-match x-fm-canary
            # (RegularExpression .+). The gateway strips any client-set header and
            # re-injects the secret only for a valid cookie, so the marker is
            # non-forgeable at the edge and presence is sufficient; the secret must
            # NOT be duplicated into the route.
            route="deploy/infrastructure/gateway/canary/${SVC}-canary.yaml"
            if [ ! -f "$route" ]; then
              echo "::error::No canary route for '$SVC' (expected $route) — arm it on main first (see deploy/infrastructure/gateway/canary/)."
              exit 1
            fi
            if ! grep -q 'x-fm-canary' "$route" \
               || ! grep -Eq 'type:[[:space:]]*RegularExpression' "$route" \
               || ! grep -Eq 'value:[[:space:]]*"?\.\+' "$route"; then
              echo "::error::Canary route $route lacks a PRESENCE x-fm-canary match (RegularExpression '.+') — refusing (a missing gate would serve the canary to unmarked traffic)."
              exit 1
            fi
            if grep -qE '[0-9a-fA-F]{32}' "$route"; then
              echo "::error::Canary route $route CONTAINS a secret-looking 32-hex literal — refusing (the secret lives in the fm-canary-token Secret; routes presence-match only)."
              exit 1
            fi
          else
            # EAST-WEST: INTERNAL-only service steered in-mesh by a VirtualService
            # that PRESENCE-matches x-fm-canary (regex .+) on gateways:[mesh]. The
            # secret must NEVER appear in a mesh VS (the marker is already
            # non-forgeable in-mesh) — fail CLOSED if it does.
            route="deploy/infrastructure/mesh-policies/canary/${SVC}-canary-eastwest.yaml"
            if [ ! -f "$route" ]; then
              echo "::error::No east-west canary VS for '$SVC' (expected $route) — arm it on main first (see deploy/infrastructure/mesh-policies/canary/)."
              exit 1
            fi
            # gateways: must be EXACTLY [mesh] — a stray ingress/fm-gateway entry
            # would attach this INTERNAL route to the edge and expose it (fail closed).
            gw_only_mesh='
              /^[[:space:]]*gateways:[[:space:]]*\[/ {
                l=$0; sub(/.*\[/,"",l); sub(/\].*/,"",l); gsub(/[[:space:]"]/,"",l);
                n=split(l,a,","); for(i=1;i<=n;i++) if(a[i]!=""){t++; if(a[i]=="mesh")m++}
                next }
              /^[[:space:]]*gateways:[[:space:]]*$/ {g=1; next}
              g && /^[[:space:]]*#/ {next}
              g && /^[[:space:]]*-/ {
                v=$0; sub(/^[[:space:]]*-[[:space:]]*/,"",v); sub(/[[:space:]]*#.*/,"",v); gsub(/[[:space:]"]/,"",v);
                t++; if(v=="mesh")m++; next }
              g && /^[[:space:]]*$/ {next}
              g {g=0}
              END{ exit (t==1 && m==1)?0:1 }'
            if ! grep -q 'x-fm-canary' "$route" \
               || ! grep -Eq 'regex:[[:space:]]*"?\.\+' "$route" \
               || ! awk "$gw_only_mesh" "$route"; then
              echo "::error::East-west VS $route lacks a PRESENCE x-fm-canary regex (.+) on gateways EXACTLY [mesh] — refusing (no ingress/fm-gateway leak)."
              exit 1
            fi
            if grep -qE '[0-9a-fA-F]{32}' "$route"; then
              echo "::error::East-west VS $route CONTAINS a secret-looking 32-hex literal — refusing (a mesh VS must presence-match only; the secret lives in the fm-canary-token Secret)."
              exit 1
            fi
          fi
          echo "Preflight OK: '$SVC' is armed (routing_class=$rc; base manifest + overlay entry + a valid toggled route/VS gate)."

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      shortsha: ${{ steps.rev.outputs.shortsha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: rev
        run: echo "shortsha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - id: ctx
        # Resolve build context + Dockerfile per service, mirroring
        # build-images.yml's matrix: Python backends build from the repo root so
        # their Dockerfiles can COPY libs/fm_runtime; the SPA images keep their
        # own self-contained build context.
        # KEEP THE SERVICE LIST BELOW IN SYNC with the `service` input's
        # `options:` above — workflow_dispatch requires STATIC choice options,
        # so the enumeration can't be derived from a single source here.
        run: |
          set -euo pipefail
          case "${{ inputs.service }}" in
            search|leads|mcp|mail|jobs|agents)
              echo "context=." >> "$GITHUB_OUTPUT" ;;
            frontend|mailui|agentsui|searchui)
              echo "context=./${{ inputs.service }}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unknown service '${{ inputs.service }}'." >&2; exit 1 ;;
          esac
          echo "dockerfile=${{ inputs.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.dockerfile }}
          push: true
          # VITE_TELEMETRY=1 bakes the Faro RUM bootstrap into an SPA bundle;
          # APP_VERSION stamps the exact canary tag so RUM version == image tag.
          # Passed UNIFORMLY to every service — backends don't declare these
          # ARGs and just emit a harmless "unconsumed ARG" warning (identical to
          # build-images.yml's APP_VERSION handling).
          build-args: |
            VITE_TELEMETRY=1
            APP_VERSION=canary-${{ steps.rev.outputs.shortsha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ inputs.service }}:canary-${{ steps.rev.outputs.shortsha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-canary

  pin:
    needs: build
    runs-on: ubuntu-latest
    # ACTIVATION APPROVAL GATE: this job flips replicas 0->1 (feature-branch code
    # goes live under stable's prod identity), so it runs under the protected
    # `canary-activation` environment — GitHub PAUSES it for a manual reviewer
    # approval in the Actions UI. Only ACTIVATION waits; build+push already ran.
    environment: canary-activation
    permissions:
      contents: write
    steps:
      # Pin onto main (what Flux watches), regardless of which ref was built.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin canary tag + activate (replicas 0 -> 1)
        run: |
          set -euo pipefail
          TAG="canary-${{ needs.build.outputs.shortsha }}"
          SVC="${{ inputs.service }}"
          overlay="deploy/apps/overlays/prod/kustomization.yaml"
          dep="deploy/apps/base/${SVC}-canary/deployment.yaml"
          # ROUTING CLASS selects the toggled route artifact + kustomization +
          # insertion anchor (keep in sync with preflight + the `service` options).
          case "$SVC" in
            frontend|searchui|mailui|agentsui|search|mail|agents) rc=gateway ;;
            leads|mcp|jobs) rc=eastwest ;;
            *) echo "unknown service '$SVC' (no routing class)" >&2; exit 1 ;;
          esac
          if [ "$rc" = gateway ]; then
            kustomization="deploy/infrastructure/gateway/kustomization.yaml"
            route_entry="canary/${SVC}-canary.yaml"
            route_file="deploy/infrastructure/gateway/${route_entry}"
            anchor='- referencegrants\.yaml'
          else
            kustomization="deploy/infrastructure/mesh-policies/kustomization.yaml"
            route_entry="canary/${SVC}-canary-eastwest.yaml"
            route_file="deploy/infrastructure/mesh-policies/${route_entry}"
            anchor='- debug-session-gate\.yaml'
          fi
          # SINGLE derivation for this job: hand the resolved kustomization to the
          # next step (same runner/checkout) via $GITHUB_ENV rather than re-deriving
          # the class split from $SVC a second time.
          echo "kustomization=$kustomization" >> "$GITHUB_ENV"
          # Guard ALL legs of the canary contract (preflight already asserted
          # this on main; re-assert here — this is the job that actually WRITES).
          if [ ! -f "$dep" ]; then
            echo "No canary base manifest for '$SVC' (expected $dep)." >&2
            echo "Add its <svc>-canary base + overlay images entry first — see build-canary.yml header." >&2
            exit 1
          fi
          if ! grep -q "funnelmanager/${SVC}-canary" "$overlay"; then
            echo "No '${SVC}-canary' images entry in $overlay." >&2
            echo "Add its <svc>-canary base + overlay images entry first — see build-canary.yml header." >&2
            exit 1
          fi
          if [ ! -f "$route_file" ]; then
            echo "No canary route/VS for '$SVC' (expected $route_file)." >&2
            echo "Arm its toggled route first — see deploy/infrastructure/{gateway,mesh-policies}/canary/." >&2
            exit 1
          fi
          # Re-assert the route gate correctness (preflight already checked this on
          # main; this is the job that ACTIVATES, so re-verify before flipping
          # replicas). The secret is NOT in git — it lives in the fm-canary-token
          # Secret and is injected at the gateway; routes presence-match and must
          # carry NO secret-looking literal.
          if [ "$rc" = gateway ]; then
            if ! grep -q 'x-fm-canary' "$route_file" \
               || ! grep -Eq 'type:[[:space:]]*RegularExpression' "$route_file" \
               || ! grep -Eq 'value:[[:space:]]*"?\.\+' "$route_file"; then
              echo "Canary route $route_file lacks a PRESENCE x-fm-canary match (RegularExpression '.+') — refusing to activate." >&2
              exit 1
            fi
            if grep -qE '[0-9a-fA-F]{32}' "$route_file"; then
              echo "Canary route $route_file CONTAINS a secret-looking 32-hex literal — refusing to activate (the secret lives in the fm-canary-token Secret; routes presence-match)." >&2
              exit 1
            fi
          else
            # east-west VS: PRESENCE regex, gateways EXACTLY [mesh] (no ingress/
            # fm-gateway leak), and no secret literal — all fail-closed.
            gw_only_mesh='
              /^[[:space:]]*gateways:[[:space:]]*\[/ {
                l=$0; sub(/.*\[/,"",l); sub(/\].*/,"",l); gsub(/[[:space:]"]/,"",l);
                n=split(l,a,","); for(i=1;i<=n;i++) if(a[i]!=""){t++; if(a[i]=="mesh")m++}
                next }
              /^[[:space:]]*gateways:[[:space:]]*$/ {g=1; next}
              g && /^[[:space:]]*#/ {next}
              g && /^[[:space:]]*-/ {
                v=$0; sub(/^[[:space:]]*-[[:space:]]*/,"",v); sub(/[[:space:]]*#.*/,"",v); gsub(/[[:space:]"]/,"",v);
                t++; if(v=="mesh")m++; next }
              g && /^[[:space:]]*$/ {next}
              g {g=0}
              END{ exit (t==1 && m==1)?0:1 }'
            if ! grep -q 'x-fm-canary' "$route_file" \
               || ! grep -Eq 'regex:[[:space:]]*"?\.\+' "$route_file" \
               || ! awk "$gw_only_mesh" "$route_file"; then
              echo "East-west VS $route_file lacks a PRESENCE x-fm-canary regex (.+) on gateways EXACTLY [mesh] — refusing to activate." >&2
              exit 1
            fi
            if grep -qE '[0-9a-fA-F]{32}' "$route_file"; then
              echo "East-west VS $route_file CONTAINS a secret-looking 32-hex literal — refusing to activate (mesh VS must presence-match only)." >&2
              exit 1
            fi
          fi
          # Rewrite ONLY this service's canary image entry — the `images:` block
          # whose name is `.../${SVC}-canary`. A blanket `s/newTag: canary-.*/`
          # would clobber EVERY canary once more than one is live, so scope to
          # the name block. Done with awk (not yq) to preserve the overlay's
          # extensive explanatory comments, which yq would strip on rewrite.
          # awk exits 3 if it never matched a newTag inside the block, so a
          # silent no-op (entry missing, or a differently-quoted `name:` the
          # block regex can't hit) FAILS CLOSED here — BEFORE activation —
          # instead of flipping replicas onto an unrewritten `canary-PINME`
          # placeholder and ImagePullBackOff'ing in prod while CI says success.
          if awk -v svc="$SVC" -v tag="$TAG" '
            /^[[:space:]]*- name:/ {
              inblock = ($0 ~ ("funnelmanager/" svc "-canary$")) ? 1 : 0
            }
            inblock && /^[[:space:]]*newTag:/ {
              sub(/newTag:.*/, "newTag: " tag); inblock = 0; matched = 1
            }
            { print }
            END { if (!matched) exit 3 }
          ' "$overlay" > "$overlay.tmp"; then
            mv "$overlay.tmp" "$overlay"
          else
            rm -f "$overlay.tmp"
            echo "Pin no-op: awk matched no '${SVC}-canary' newTag in $overlay." >&2
            echo "The images entry's name: line isn't in the expected form — NOT activating." >&2
            exit 1
          fi
          # Activate ONLY after a confirmed-successful pin: the committed default
          # is replicas: 0 (idle so the PINME placeholder is never pulled). Scale
          # to 1 to make the canary live.
          sed -i -E "s/(^[[:space:]]*replicas:[[:space:]]*)[0-9]+/\11/" "$dep"
          # canary-if-exists-else-stable: add the <svc>-canary route/VS to its
          # kustomization in the SAME commit that activates (replicas 0->1). The
          # route exists ONLY while the canary is up, so an idle canary can never
          # 503 the x-fm-canary marker — it falls through to stable. `canary.sh
          # retire` removes this line when it scales back to 0. Anchor the insert to
          # a STRUCTURAL resource line (a stable YAML token) — for gateway that is
          # `- referencegrants.yaml`, for east-west `- debug-session-gate.yaml` —
          # NOT a prose comment, so a comment edit can't break it. Match only
          # UNCOMMENTED resource lines (`^  - `) so a commented note is never
          # mistaken for an existing entry. Idempotent: skip if already present.
          if grep -E '^[[:space:]]*- ' "$kustomization" | grep -qF -- "- ${route_entry}"; then
            echo "Canary route ${route_entry} already listed in $kustomization."
          else
            sed -i "/^[[:space:]]*${anchor}[[:space:]]*$/a\\  - ${route_entry}" "$kustomization"
            grep -E '^[[:space:]]*- ' "$kustomization" | grep -qF -- "- ${route_entry}" || {
              echo "::error::failed to add ${route_entry} to $kustomization (anchor '${anchor}' missing?)" >&2
              exit 1
            }
            echo "Activated canary route ${route_entry} in $kustomization."
          fi
          git diff --stat
      - name: Commit the pin + activation
        run: |
          set -euo pipefail
          git config user.name  "funnelmanager-ci[bot]"
          git config user.email "ci@users.noreply.github.com"
          SVC="${{ inputs.service }}"
          # $kustomization comes from the pin step via $GITHUB_ENV (single
          # routing-class derivation for this job — not re-derived here). Stage the
          # overlay pin, the replicas activation, AND that route toggle (a no-op add
          # if the route line was already present — the --cached guard below then
          # reports nothing new there).
          git add \
            "deploy/apps/overlays/prod/kustomization.yaml" \
            "deploy/apps/base/${SVC}-canary/deployment.yaml" \
            "$kustomization"
          if git diff --cached --quiet; then
            echo "Nothing to pin (same tag already live)."; exit 0
          fi
          git commit -m "ci(canary): pin ${{ inputs.service }} to canary-${{ needs.build.outputs.shortsha }} [skip ci]"
          git push origin main
