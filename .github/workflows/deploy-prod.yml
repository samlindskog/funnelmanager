name: Deploy prod (usfr2)

# Manual / tagged deploys only — pushing to main never ships to prod on its own.
#   * push a tag matching v*    → builds images from that tag and deploys them
#   * "Run workflow" (dispatch) → builds + deploys the ref you enter (default main)
#
# All image builds happen on GitHub runners and are pushed to GHCR. The server
# never builds and needs no source checkout: the deploy step streams
# docker-compose.prod.yml (plus ephemeral GHCR credentials) to the forced-command
# hook (deploy/prod-deploy-hook.sh), which pulls the freshly pushed images and
# restarts the stack.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to deploy (tag, branch, or commit SHA)'
        required: false
        default: 'main'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [search, leads, auth, mcp, mail, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build moves the `prod` tag (what the server pulls by default) and
      # adds an immutable sha-<sha> tag; tag pushes also add the release tag for
      # pinning/rollback via the hook's optional IMAGE_TAG argument.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=prod
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Attach a GitHub "production" environment so you can optionally require a
    # reviewer approval before any prod deploy runs (Settings → Environments).
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH (pull-only)
        run: |
          # Protocol understood by deploy/prod-deploy-hook.sh on the server:
          #   stdin line 1: GHCR username
          #   stdin line 2: GHCR token (this run's ephemeral GITHUB_TOKEN)
          #   stdin rest:   docker-compose.prod.yml at the deployed ref
          {
            printf '%s\n' "${{ github.actor }}"
            printf '%s\n' "${{ secrets.GITHUB_TOKEN }}"
            cat docker-compose.prod.yml
          } | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" deploy
