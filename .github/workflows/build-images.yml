# Reusable: build+push all eleven images to GHCR, then pin the resulting
# immutable sha tag into an environment overlay and commit it back to main.
# Flux (watching main) reconciles the pin and rolls out the new version —
# the deploy is a git commit, not an SSH push. GitOps for k3s.
name: build-images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build the images from.
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: vars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Python services build from the repo root so their Dockerfiles can
        # COPY libs/fm_runtime; the SPA images keep their own contexts.
        include:
          - { service: search,   context: .,        dockerfile: search/Dockerfile }
          - { service: leads,    context: .,        dockerfile: leads/Dockerfile }
          - { service: mcp,      context: .,        dockerfile: mcp/Dockerfile }
          - { service: mail,     context: .,        dockerfile: mail/Dockerfile }
          - { service: mailui,   context: ./mailui, dockerfile: mailui/Dockerfile }
          - { service: frontend, context: ./frontend, dockerfile: frontend/Dockerfile }
          - { service: jobs,     context: .,        dockerfile: jobs/Dockerfile }
          - { service: agents,   context: .,        dockerfile: agents/Dockerfile }
          - { service: agentsui, context: ./agentsui, dockerfile: agentsui/Dockerfile }
          - { service: searchui, context: ./searchui, dockerfile: searchui/Dockerfile }
          - { service: backup,   context: ./backup, dockerfile: backup/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Baked into the SPA bundles (frontend/mailui/agentsui declare
          # `ARG APP_VERSION`) so Faro RUM stamps the exact deployed image tag.
          # Passed to every matrix image; the 7 backend Dockerfiles don't
          # declare the ARG and just emit a harmless "unconsumed" warning. Uses
          # the SAME sha that becomes the image tag below, so RUM version ==
          # deployed image tag.
          build-args: |
            APP_VERSION=sha-${{ needs.vars.outputs.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ needs.vars.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:prod
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  pin:
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pin onto main (what Flux watches), regardless of which ref was built.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin prod overlay to sha-${{ needs.vars.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="sha-${{ needs.vars.outputs.sha }}"
          f="deploy/apps/overlays/prod/kustomization.yaml"
          # Replace every STABLE `newTag: sha-<...>` under the images: block.
          # Scoped to the `sha-` prefix so the header-routed canary entry
          # (`newTag: canary-<...>`, pinned by build-canary.yml) is left
          # untouched — the two pin jobs must never clobber each other.
          sed -i -E "s/(^[[:space:]]*newTag:[[:space:]]*)sha-.*/\1$SHA/" "$f"
          git diff --stat
      - name: Rebuild fm-origin provider JAR + ConfigMap from src/
        # Keep the committed Keycloak script-provider artifacts CI-reproduced
        # from src/ (never hand-authored), just like the sha-image pins. The
        # build is deterministic, so this is a no-op unless src/ changed.
        run: deploy/keycloak/providers/build.sh
      - name: Commit the pin (+ regenerated provider artifacts)
        run: |
          set -euo pipefail
          git config user.name  "funnelmanager-ci[bot]"
          git config user.email "ci@users.noreply.github.com"
          git add \
            "deploy/apps/overlays/prod/kustomization.yaml" \
            deploy/keycloak/providers/fm-origin-provider.jar \
            deploy/infrastructure/identity/providers-configmap.yaml
          if git diff --cached --quiet; then
            echo "Nothing to pin or regenerate."; exit 0
          fi
          git commit -m "ci(prod): pin images to sha-${{ needs.vars.outputs.sha }} [skip ci]"
          git push origin main
