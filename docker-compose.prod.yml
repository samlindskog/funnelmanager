# Prod runs prebuilt images pulled from GHCR — nothing builds on the host and no
# source checkout is needed. `.github/workflows/deploy-prod.yml` builds/pushes the
# images on GitHub runners, then ships this file to the server and pulls.
# IMAGE_TAG selects the image set (default: the moving `prod` tag CI pushes on
# every deploy; per-commit `sha-<sha>` and release `v*` tags exist for pinning).
#
# `name:` is pinned so deploys from any directory keep reusing the existing
# `funnelmanager-prod_*` containers and data volumes.
name: funnelmanager-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger defaults to ~50% of host RAM per mongod; two stacks share this
    # box, so pin the cache small — payload data lives on disk and the working
    # set is tiny. Keep this the first thing to shrink under memory pressure.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    mem_limit: 1536m
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    # Milvus reads its cgroup limit and scales its internal watermarks to it;
    # the hard cap keeps segment caches from competing with the rest of the box.
    mem_limit: 3g
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    expose:
      - "19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  backend:
    image: ghcr.io/samlindskog/funnelmanager/backend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    depends_on:
      db:
        condition: service_healthy
      leads-backend:
        condition: service_started
      auth-backend:
        condition: service_started
    expose:
      - "8000"

  leads-backend:
    image: ghcr.io/samlindskog/funnelmanager/leads-backend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    # Highest app cap: serializing enriched Apollo docs (~5MB JSON per 100
    # leads) through pydantic spikes well past idle usage.
    mem_limit: 1536m
    environment:
      APOLLO_API_KEY: ${APOLLO_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # No fallback: the webhook route refuses to serve without a real secret.
      APOLLO_WEBHOOK_SECRET: ${APOLLO_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy
    expose:
      - "8001"

  auth-backend:
    image: ghcr.io/samlindskog/funnelmanager/auth-backend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8002"

  mcp-server:
    image: ghcr.io/samlindskog/funnelmanager/mcp-server:${IMAGE_TAG:-prod}
    restart: unless-stopped
    # Parses full lead payloads before summarizing for agents; give it spike room.
    mem_limit: 1g
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SEARCH_BACKEND_URL: ${SEARCH_BACKEND_URL:-http://backend:8000}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    # Loopback-only publish: host-local MCP clients (e.g. OpenClaw) can reach
    # http://127.0.0.1:8003/mcp, the internet cannot. Drop the ports block to
    # keep it Docker-network-only; nginx never routes to it. PROD_MCP_PORT lets a
    # second (coexisting) stack avoid a host-port clash with another deployment.
    ports:
      - "${HOST_BIND:-127.0.0.1:}${PROD_MCP_PORT:-8003}:8003"
    expose:
      - "8003"
    depends_on:
      - backend
      - leads-backend
      - auth-backend

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    mem_limit: 3g
    # Opt-in in prod: `docker compose --profile agent up -d` starts the agent.
    # Kept off by default so a coexisting stack does not run a second Telegram
    # poller against the same bot token. Give prod its own TELEGRAM_BOT_TOKEN
    # before enabling.
    profiles:
      - agent
    environment:
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Agent model: OpenAI today; Anthropic stays wired in openclaw.json for
      # when ANTHROPIC_API_KEY is available.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # State dir must exist next to this compose file (or point elsewhere via
      # OPENCLAW_STATE_DIR) — there is no source checkout to provide it.
      - ${OPENCLAW_STATE_DIR:-./openclaw}:/home/node/.openclaw
      - openclaw_auth:/home/node/.config/openclaw
    # Loopback-only: open the Control UI via an SSH tunnel or put a TLS
    # reverse proxy in front. Telegram is outbound-only and needs no port.
    ports:
      - "${HOST_BIND:-127.0.0.1:}${PROD_OPENCLAW_PORT:-18789}:18789"
    depends_on:
      - mcp-server

  frontend:
    image: ghcr.io/samlindskog/funnelmanager/frontend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN}
    # HOST_BIND pins the published port to loopback (e.g. "127.0.0.1:") so a host
    # TLS reverse proxy fronts it and Docker does not bypass ufw; PROD_HTTP_PORT
    # frees port 80 when another stack coexists on the box.
    ports:
      - "${HOST_BIND:-}${PROD_HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - leads-backend
      - auth-backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  openclaw_auth:
