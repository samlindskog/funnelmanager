services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    expose:
      - "19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    depends_on:
      db:
        condition: service_healthy
      leads-backend:
        condition: service_started
      auth-backend:
        condition: service_started
    expose:
      - "8000"

  leads-backend:
    build:
      context: ./leads-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APOLLO_API_KEY: ${APOLLO_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # No fallback: the webhook route refuses to serve without a real secret.
      APOLLO_WEBHOOK_SECRET: ${APOLLO_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy
    expose:
      - "8001"

  auth-backend:
    build:
      context: ./auth-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8002"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      SEARCH_BACKEND_URL: ${SEARCH_BACKEND_URL:-http://backend:8000}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads-backend:8001}
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://auth-backend:8002}
    # Loopback-only publish: host-local MCP clients (e.g. OpenClaw) can reach
    # http://127.0.0.1:8003/mcp, the internet cannot. Drop the ports block to
    # keep it Docker-network-only; nginx never routes to it.
    ports:
      - "127.0.0.1:8003:8003"
    expose:
      - "8003"
    depends_on:
      - backend
      - leads-backend
      - auth-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
    depends_on:
      - backend
      - leads-backend
      - auth-backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
