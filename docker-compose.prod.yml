# Prod runs prebuilt images pulled from GHCR — nothing builds on the host and no
# source checkout is needed. `.github/workflows/deploy-prod.yml` builds/pushes the
# images on GitHub runners, then ships this file to the server and pulls.
# IMAGE_TAG selects the image set (default: the moving `prod` tag CI pushes on
# every deploy; per-commit `sha-<sha>` and release `v*` tags exist for pinning).
#
# `name:` is pinned so deploys from any directory keep reusing the existing
# `funnelmanager-prod_*` containers and data volumes.
name: funnelmanager-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger defaults to ~50% of host RAM per mongod; two stacks share this
    # box, so pin the cache small — payload data lives on disk and the working
    # set is tiny. Keep this the first thing to shrink under memory pressure.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    mem_limit: 1536m
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    # Milvus reads its cgroup limit and scales its internal watermarks to it;
    # the hard cap keeps segment caches from competing with the rest of the box.
    mem_limit: 3g
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    expose:
      - "19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  search:
    image: ghcr.io/samlindskog/funnelmanager/search:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      FM_SERVICE_NAME: search
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: search
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_SEARCH_SECRET}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
    depends_on:
      db:
        condition: service_healthy
      leads:
        condition: service_started
      keycloak:
        condition: service_started
    expose:
      - "8000"

  leads:
    image: ghcr.io/samlindskog/funnelmanager/leads:${IMAGE_TAG:-prod}
    restart: unless-stopped
    # Highest app cap: serializing enriched Apollo docs (~5MB JSON per 100
    # leads) through pydantic spikes well past idle usage.
    mem_limit: 1536m
    environment:
      APOLLO_API_KEY: ${APOLLO_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # No fallback: the webhook route refuses to serve without a real secret.
      APOLLO_WEBHOOK_SECRET: ${APOLLO_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-funnelmanager_leads}
      FM_SERVICE_NAME: leads
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: leads
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_LEADS_SECRET}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-leads_people}
    depends_on:
      mongo:
        condition: service_healthy
      milvus:
        condition: service_healthy
    expose:
      - "8001"

  # Dedicated Postgres for the mail archive — the mail service is the only
  # consumer; the shared `db` stays search-only.
  mail-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: funnelmanager_mail
    volumes:
      - mail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d funnelmanager_mail"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: ghcr.io/samlindskog/funnelmanager/mail:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Dedicated mail-db container above.
      DATABASE_URL: ${MAIL_DATABASE_URL}
      FM_SERVICE_NAME: mail
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: mail
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_MAIL_SECRET}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Blank = derived from PUBLIC_BASE_URL (https://domain/api/mail/oauth/callback);
      # either way it must be an authorized redirect URI on the OAuth client.
      OAUTH_REDIRECT_URL: ${MAIL_OAUTH_REDIRECT_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      mail-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "8004"

  # Standalone mail UI — static app served same-origin at /mail/ behind the
  # frontend nginx so it shares the hub's session token.
  mailui:
    image: ghcr.io/samlindskog/funnelmanager/mailui:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # Baked into /mail/config.js at container start (shared OIDC session
      # with the hub — same public client).
      FRONTEND_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FRONTEND_OIDC_CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-frontend}
    expose:
      - "80"
    depends_on:
      - mail

  # Identity provider (sole OIDC issuer). Interim compose deployment until
  # the k3s cluster (deploy/) takes over: dev-mode storage on a named volume,
  # realm imported from deploy/keycloak/ on first start. FM_OIDC_ISSUER must
  # be the browser-facing URL (e.g. https://kc.<domain>/realms/funnelmanager)
  # with a TLS reverse proxy in front of the published port.
  keycloak:
    # Pinned to a concrete 26.2.x patch + digest (verified on quay.io). The
    # script-mapper mechanism was proven on 26.2; stay on 26.2.x. Bump both the
    # tag and the digest together.
    image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm", "--proxy-headers", "xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      # Backchannel requests (token exchange from the service containers) must
      # mint tokens with the SAME issuer the browser sees; a dynamic
      # backchannel hostname would stamp the container-DNS issuer and break
      # every service's pinned-issuer verification.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # Enables the fm-origin-provider script mapper (below), which propagates
      # the fm_origin claim across RFC 8693 token exchanges so an agent-initiated
      # origin survives every hop. 'scripts' is a preview feature.
      KC_FEATURES: scripts
    volumes:
      # No default on purpose: the tracked realm file is the DEV realm
      # (admin/admin application user, published client secrets) and must
      # never reach prod. Start from
      # deploy/keycloak/realm-funnelmanager-prod.example.json.
      - ${KEYCLOAK_REALM_FILE:?point KEYCLOAK_REALM_FILE at a hardened realm export — never the tracked dev realm}:/opt/keycloak/data/import/realm.json:ro
      # Script provider: carries fm_origin across every exchange hop. The
      # hardened prod realm's fm-origin scope references its mapper
      # (script-fm-origin-passthrough.js), so the JAR must be present.
      - ./deploy/keycloak/providers/fm-origin-provider.jar:/opt/keycloak/providers/fm-origin-provider.jar:ro
      - keycloak_data:/opt/keycloak/data/h2
    ports:
      - "${HOST_BIND:-127.0.0.1:}${PROD_KC_PORT:-8080}:8080"
    expose:
      - "8080"

  mcp:
    image: ghcr.io/samlindskog/funnelmanager/mcp:${IMAGE_TAG:-prod}
    restart: unless-stopped
    # Parses full lead payloads before summarizing for agents; give it spike room.
    mem_limit: 1g
    environment:
      # Tokenless-call fallback (act as the MCP service identity) is OFF in
      # prod — clients must pass the acting principal's token per call.
      MCP_SHARED_LOGIN_FALLBACK: ${MCP_SHARED_LOGIN_FALLBACK:-false}
      LEADS_BACKEND_URL: ${LEADS_BACKEND_URL:-http://leads:8001}
      FM_SERVICE_NAME: mcp
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: mcp
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_MCP_SECRET}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json).
      FM_ENFORCE_GRANTS: "true"
    # Loopback-only publish: host-local MCP clients can reach
    # http://127.0.0.1:8003/mcp, the internet cannot. Drop the ports block to
    # keep it Docker-network-only; nginx never routes to it. PROD_MCP_PORT lets a
    # second (coexisting) stack avoid a host-port clash with another deployment.
    ports:
      - "${HOST_BIND:-127.0.0.1:}${PROD_MCP_PORT:-8003}:8003"
    expose:
      - "8003"
    depends_on:
      - leads
      - keycloak

  # Dedicated Postgres for the jobs store — the jobs service is the only
  # consumer (own db funnelmanager_jobs; follows the mail-db pattern).
  jobs-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: funnelmanager_jobs
    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d funnelmanager_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Jobs service (:8005) — subscribes to each producer's job-event stream and
  # proxies its control API. v1 producer = search only (agents not wired yet).
  # Internal only: nginx never routes to it; published on loopback like mcp.
  jobs:
    image: ghcr.io/samlindskog/funnelmanager/jobs:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Dedicated jobs-db container above.
      DATABASE_URL: ${JOBS_DATABASE_URL}
      FM_SERVICE_NAME: jobs
      FM_JWT_VERIFY: "true"
      FM_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FM_OIDC_TOKEN_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/token
      FM_OIDC_JWKS_URL: http://keycloak:8080/realms/funnelmanager/protocol/openid-connect/certs
      FM_OIDC_CLIENT_ID: jobs
      FM_OIDC_CLIENT_SECRET: ${FM_OIDC_JOBS_SECRET}
      # No mesh/OPA in compose - fm_runtime enforces the role grants itself
      # (mirrors deploy/policy/data.json). The jobs service account holds the
      # jobs-internal role (reaches producers' /internal/jobs/*).
      FM_ENFORCE_GRANTS: "true"
      # Config-driven producer registry: v1 = search only (agents not wired
      # yet). name=base_url; name is BOTH the Job.app value and the
      # token-exchange audience (svc scope jobs->search).
      JOBS_PRODUCERS: ${JOBS_PRODUCERS:-search=http://search:8000}
    # Loopback-only publish like mcp: host-local inspection at 127.0.0.1:8005;
    # the internet cannot reach it and nginx never routes to it. PROD_JOBS_PORT
    # frees the host port when a second stack coexists on the box.
    ports:
      - "${HOST_BIND:-127.0.0.1:}${PROD_JOBS_PORT:-8005}:8005"
    expose:
      - "8005"
    depends_on:
      jobs-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      search:
        condition: service_started

  frontend:
    image: ghcr.io/samlindskog/funnelmanager/frontend:${IMAGE_TAG:-prod}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN}
      # Baked into /config.js at container start (browser-side OIDC config
      # + optional hub app list).
      FRONTEND_OIDC_ISSUER: ${FM_OIDC_ISSUER}
      FRONTEND_OIDC_CLIENT_ID: ${FRONTEND_OIDC_CLIENT_ID:-frontend}
      WEB_APPS: ${WEB_APPS:-}
    # HOST_BIND pins the published port to loopback (e.g. "127.0.0.1:") so a host
    # TLS reverse proxy fronts it and Docker does not bypass ufw; PROD_HTTP_PORT
    # frees port 80 when another stack coexists on the box.
    ports:
      - "${HOST_BIND:-}${PROD_HTTP_PORT:-80}:80"
    depends_on:
      - search
      - leads
      - mail
      - mailui

volumes:
  keycloak_data:
  postgres_data:
  mail_postgres_data:
  jobs_postgres_data:
  mongo_data:
  etcd_data:
  minio_data:
  milvus_data:
