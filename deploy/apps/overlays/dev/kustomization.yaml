apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base/search
  - ../../base/leads
  - ../../base/mail
  - ../../base/mcp
  - ../../base/jobs
  - ../../base/frontend
  - ../../base/mailui
  # Data stack (CNPG clusters, mongo, milvus, etcd, minio) — authored under
  # base/data; this overlay just instantiates it in the dev namespace.
  - ../../base/data
  - ../../base/netpol

# sha-PINME is a placeholder: replace with the deployed image tag
# (sha-<gitsha>). Never :latest.
images:
  - name: ghcr.io/samlindskog/funnelmanager/search
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/leads
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/mail
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/mcp
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/jobs
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/frontend
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/mailui
    newTag: sha-PINME
  - name: ghcr.io/samlindskog/funnelmanager/backup
    newTag: sha-PINME

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: fm-oidc
    literals:
      # Dev uses the funnelmanager-dev realm on the shared Keycloak.
      - issuer=https://kc.x9bc433.win/realms/funnelmanager-dev
      # Split horizon: the public issuer host is not reachable from the app
      # namespaces (default-deny egress) — token exchange dials Keycloak's
      # in-cluster Service; issued tokens still carry the public issuer.
      - token-url=http://keycloak.identity.svc.cluster.local:8080/realms/funnelmanager-dev/protocol/openid-connect/token
  - name: fm-web
    literals:
      # Dev environment host — NOT the prod one: webhooks and CORS built from
      # these must land on this environment (gateway https-dev listener).
      - domain=dev.x9bc433.win
      - cors-origins=https://dev.x9bc433.win
      - public-base-url=https://dev.x9bc433.win
      - web-apps=
      - 'admin-apps=[{"name":"Grafana","description":"Metrics, logs & dashboards","url":"https://grafana.x9bc433.win"}]'

patches:
  # Replace-in-place rollouts (maxSurge 0): the 8GB worker's memory-limit
  # quota has no headroom to run an old + new pod at once.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored-by-target-selector
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  # Every dev pod runs at the fm-dev PriorityClass (see CONVENTIONS.md);
  # the placeholder metadata.name is ignored — the target selector applies
  # the patch to all Deployments/StatefulSets.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored-by-target-selector
      spec:
        template:
          spec:
            priorityClassName: fm-dev
  - target:
      kind: StatefulSet
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ignored-by-target-selector
      spec:
        template:
          spec:
            priorityClassName: fm-dev
  # Dev halves app requests, keeps limits (CONVENTIONS.md).
  - target:
      kind: Deployment
      name: search
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: leads
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
  - target:
      kind: Deployment
      name: mail
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: mcp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: jobs
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 5m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 8Mi
  - target:
      kind: Deployment
      name: mailui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 5m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 8Mi
  # Private GHCR images: every workload SA carries the pull secret
  # (created at bootstrap — see deploy/bootstrap/README.md).
  - target:
      kind: ServiceAccount
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: ghcr-pull
