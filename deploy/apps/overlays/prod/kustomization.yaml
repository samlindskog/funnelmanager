apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base/search
  - ../../base/leads
  - ../../base/mail
  - ../../base/mcp
  - ../../base/jobs
  - ../../base/agents
  - ../../base/frontend
  - ../../base/frontend-canary
  - ../../base/search-canary
  - ../../base/searchui-canary
  - ../../base/leads-canary
  - ../../base/mailui
  - ../../base/agentsui
  - ../../base/searchui
  # Data stack (CNPG clusters, mongo, milvus, etcd, minio) — authored under
  # base/data; this overlay just instantiates it in the prod namespace.
  - ../../base/data
  - ../../base/netpol

# sha-PINME is a placeholder: replace with the deployed image tag
# (sha-<gitsha>). This overlay carries the currently-deployed pin;
# never :latest.
images:
  - name: ghcr.io/samlindskog/funnelmanager/search
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/leads
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/mail
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/mcp
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/jobs
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/agents
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/frontend
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/mailui
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/agentsui
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/searchui
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  - name: ghcr.io/samlindskog/funnelmanager/backup
    newTag: sha-7ccbc1bba400022ad5931fb350ac57fa77117f26
  # Header-routed frontend canary (Phase 4). Its base uses the canary-logical
  # name `.../frontend-canary`; this entry remaps it to the real `frontend`
  # repo with an INDEPENDENT `canary-<sha>` tag. Kept separate from the stable
  # `frontend` entry above (matched by exact name) so the stable sha-pin never
  # clobbers the canary tag. The `canary-PINME` placeholder is rewritten by
  # .github/workflows/build-canary.yml (which seds only `newTag: canary-*`);
  # the stable prod pin job seds only `newTag: sha-*`, so the two never collide.
  - name: ghcr.io/samlindskog/funnelmanager/frontend-canary
    newName: ghcr.io/samlindskog/funnelmanager/frontend
    newTag: canary-2e4fcd34
  # Header-routed BACKEND search canary (Step 3b). Same pattern as
  # frontend-canary above: the base uses the canary-logical name
  # `.../search-canary`; this entry remaps it to the real `search` repo with an
  # INDEPENDENT `canary-<sha>` tag, kept separate from the stable `search` entry
  # so the stable sha-pin never clobbers the canary tag. `canary-PINME` is a
  # placeholder rewritten by .github/workflows/build-canary.yml (which seds only
  # `newTag: canary-*`); it is never pulled while the canary is `replicas: 0`.
  - name: ghcr.io/samlindskog/funnelmanager/search-canary
    newName: ghcr.io/samlindskog/funnelmanager/search
    newTag: canary-5ec74260
  # Telemetry-enabled searchui (SPA) canary — the browser-originating half of the
  # full-stack search trace. Same remap pattern: the base uses the canary-logical
  # name `.../searchui-canary`; remap it to the real `searchui` repo with an
  # INDEPENDENT `canary-<sha>` tag (VITE_TELEMETRY baked in by build-canary.yml),
  # kept separate from the stable `searchui` entry so the stable sha-pin never
  # clobbers the canary tag. `canary-PINME` placeholder rewritten by
  # build-canary.yml; never pulled while `replicas: 0`.
  - name: ghcr.io/samlindskog/funnelmanager/searchui-canary
    newName: ghcr.io/samlindskog/funnelmanager/searchui
    newTag: canary-PINME
  # Header/east-west-routed BACKEND leads canary. Same pattern as search-canary:
  # the base uses the canary-logical name `.../leads-canary`; this entry remaps
  # it to the real `leads` repo with an INDEPENDENT `canary-<sha>` tag, kept
  # separate from the stable `leads` entry so the stable sha-pin never clobbers
  # the canary tag. `canary-PINME` is rewritten by build-canary.yml (seds only
  # `newTag: canary-*`); never pulled while the canary is `replicas: 0`.
  - name: ghcr.io/samlindskog/funnelmanager/leads-canary
    newName: ghcr.io/samlindskog/funnelmanager/leads
    newTag: canary-PINME

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: fm-oidc
    literals:
      - issuer=https://kc.x9bc433.win/realms/funnelmanager
      # Split horizon: the public issuer host is not reachable from the app
      # namespaces (default-deny egress) — token exchange dials Keycloak's
      # in-cluster Service; issued tokens still carry the public issuer.
      - token-url=http://keycloak.identity.svc.cluster.local:8080/realms/funnelmanager/protocol/openid-connect/token
  - name: fm-web
    literals:
      - domain=x9bc433.win
      - cors-origins=https://x9bc433.win
      - public-base-url=https://x9bc433.win
      # Hub tiles (probe-gated: a tile shows only when its /whoami answers 2xx
      # under the user's token — the backing service's authz is the source of
      # truth). Setting web-apps replaces the built-in Search+Mail default, so
      # list all three here.
      - 'web-apps=[{"name":"Search","description":"Apollo person/company search","url":"/search/","probe":"/api/search/whoami"},{"name":"Mail","description":"Google Workspace inboxes & sending","url":"/mail/","probe":"/api/mail/whoami"},{"name":"Agents","description":"AI agents that run tasks for you","url":"/agents/","probe":"/api/agents/whoami"}]'
      - 'admin-apps=[{"name":"Grafana","description":"Metrics, logs & dashboards","url":"https://grafana.x9bc433.win"}]'

patches:
  # Replace-in-place rollouts (maxSurge 0): the 8GB worker's memory-limit
  # quota has no headroom to run an old + new pod at once. Brief per-pod
  # downtime on updates is acceptable here.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored-by-target-selector
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  # Every prod pod runs at the fm-prod PriorityClass (see CONVENTIONS.md);
  # the placeholder metadata.name is ignored — the target selector applies
  # the patch to all Deployments/StatefulSets.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored-by-target-selector
      spec:
        template:
          spec:
            priorityClassName: fm-prod
  - target:
      kind: StatefulSet
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ignored-by-target-selector
      spec:
        template:
          spec:
            priorityClassName: fm-prod
  # Private GHCR images: every workload SA carries the pull secret
  # (created at bootstrap — see deploy/bootstrap/README.md).
  - target:
      kind: ServiceAccount
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: ghcr-pull
  # Canaries are throwaway variants — drop them to the LOWER `fm-dev`
  # PriorityClass (10000 < fm-prod 100000) so they are first-to-evict under the
  # tight fm-quota and never compete with real prod pods. This overrides the
  # blanket fm-prod patch above. Every canary Deployment (and ONLY canaries)
  # carries `version: canary`, so a single label-selected patch covers all of
  # them and every future one — no per-service block to add on each new canary.
  # Must come AFTER the blanket fm-prod patch to win.
  - target:
      kind: Deployment
      labelSelector: "version=canary"
    patch: |-
      - op: replace
        path: /spec/template/spec/priorityClassName
        value: fm-dev
