apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: funnelmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: mail
      nodeSelector:
        role: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mail
          # Tag is pinned only in overlays via the images transformer.
          image: ghcr.io/samlindskog/funnelmanager/mail
          ports:
            - name: http
              containerPort: 8004
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: FM_SERVICE_NAME
              value: mail
            # The mesh validates JWTs (RequestAuthentication); the app trusts them.
            - name: FM_JWT_VERIFY
              value: "false"
            - name: FM_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: fm-oidc
                  key: issuer
            - name: FM_OIDC_CLIENT_ID
              value: mail
            - name: FM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fm-oidc-mail
                  key: client-secret
            - name: FM_LOG_LEVEL
              value: INFO
            # CNPG's generated `mail-db-app` secret has key `uri` — use it directly.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mail-db-app
                  key: uri
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: client-secret
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: public-base-url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: cors-origins
