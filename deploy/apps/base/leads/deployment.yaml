apiVersion: apps/v1
kind: Deployment
metadata:
  name: leads
  labels:
    app.kubernetes.io/name: leads
    app.kubernetes.io/part-of: funnelmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: leads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leads
        app.kubernetes.io/part-of: funnelmanager
      annotations:
        # Istio's metrics merge (enablePrometheusMerge, on by default)
        # rewrites these to the sidecar's plaintext :15020, serving app
        # + Envoy metrics together — STRICT mTLS blocks scraping the app
        # port directly. The chart's kubernetes-pods job picks them up.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: leads
      nodeSelector:
        role: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: leads
          # Tag is pinned only in overlays via the images transformer.
          image: ghcr.io/samlindskog/funnelmanager/leads
          ports:
            - name: http
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 300m
              # Right-sized 2026-08-14 (steady ~555-700Mi observed; 256Mi left
              # leads far over-request and eviction-exposed under node pressure).
              memory: 768Mi
            limits:
              # Concurrent multi-company ingest+embed pipelines throttle at 1
              # core (same 2026-08-11 burst that starved search).
              cpu: 2000m
              memory: 1536Mi
          # Startup can block minutes on Milvus collection.load() after a Milvus
          # restart (2026-08-13: liveness killed startup in a loop, hard outage).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8001
            periodSeconds: 10
            failureThreshold: 42
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: FM_SERVICE_NAME
              value: leads
            # The mesh validates JWTs (RequestAuthentication); the app trusts them.
            - name: FM_JWT_VERIFY
              value: "false"
            - name: FM_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: fm-oidc
                  key: issuer
            - name: FM_OIDC_CLIENT_ID
              value: leads
            - name: FM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fm-oidc-leads
                  key: client-secret
            # Principle-4 human-approval HMAC secret (VERIFY side; agents mints).
            # Shared value across agents/leads/mail — if unset, agent-initiated
            # over-threshold actions fail closed. See fm_runtime/confirmation.py.
            - name: FM_CONFIRM_APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: fm-approval
                  key: secret
            - name: FM_LOG_LEVEL
              value: INFO
            - name: MONGODB_URL
              value: mongodb://mongo:27017
            - name: MONGODB_DB
              value: funnelmanager_leads
            - name: MILVUS_URI
              value: http://milvus:19530
            - name: MILVUS_COLLECTION
              value: leads_embeds_v2
            - name: OPENAI_EMBEDDING_MODEL
              value: text-embedding-3-small
            - name: APOLLO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: apollo
                  key: api-key
            - name: APOLLO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: apollo
                  key: webhook-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai
                  key: api-key
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: public-base-url
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: cors-origins
