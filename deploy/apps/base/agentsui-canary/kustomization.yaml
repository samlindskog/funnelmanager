apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No serviceaccount.yaml: the canary reuses the stable `agentsui` SA (defined in
# base/agentsui) so its SPIFFE identity — and thus OPA's verdict — is identical
# to stable agentsui. See deployment.yaml IDENTITY note.
resources:
  - deployment.yaml
  - service.yaml
