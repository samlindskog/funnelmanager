apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No serviceaccount.yaml: the canary reuses the stable `agents` SA (defined in
# base/agents) so its SPIFFE identity — and thus OPA's verdict — is identical to
# stable agents. See deployment.yaml IDENTITY/TRUST MODEL notes.
resources:
  - deployment.yaml
  - service.yaml
