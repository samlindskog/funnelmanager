# Distinct Service so the HTTPRoute header-match rule can target the canary
# explicitly. Its selector is `agents-canary`, so the stable `agents` Service
# (selector `agents`) never picks up canary pods and vice-versa — this is what
# guarantees no routing gap on the stable path (and no prod traffic is ever sent
# to the empty canary Service).
apiVersion: v1
kind: Service
metadata:
  name: agents-canary
  labels:
    app.kubernetes.io/name: agents-canary
    app.kubernetes.io/part-of: funnelmanager
spec:
  selector:
    app.kubernetes.io/name: agents-canary
  ports:
    - name: http
      port: 8006
      targetPort: 8006
