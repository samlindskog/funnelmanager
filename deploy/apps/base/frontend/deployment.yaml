apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: funnelmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: frontend
      nodeSelector:
        role: worker
      # No runAsNonRoot here: the current image is stock nginx whose master
      # process starts as root (binds :80, then drops privileges for workers).
      # Follow-up: switch the image to nginxinc/nginx-unprivileged:1.27-alpine
      # (listens on 8080) and restore the full non-root securityContext.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Tag is pinned only in overlays via the images transformer.
          image: ghcr.io/samlindskog/funnelmanager/frontend
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: FRONTEND_OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: fm-oidc
                  key: issuer
            - name: FRONTEND_OIDC_CLIENT_ID
              value: frontend
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: domain
            - name: WEB_APPS
              valueFrom:
                configMapKeyRef:
                  name: fm-web
                  key: web-apps
                  optional: true
