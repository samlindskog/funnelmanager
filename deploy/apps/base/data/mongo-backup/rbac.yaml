# Scoped exec: the backup runner may only exec mongodump in the mongo-0 pod
# (StatefulSet ordinal is stable) — nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongo-backup
  labels:
    app.kubernetes.io/name: mongo-backup
    app.kubernetes.io/part-of: funnelmanager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
    resourceNames: ["mongo-0"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    resourceNames: ["mongo-0"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-backup
  labels:
    app.kubernetes.io/name: mongo-backup
    app.kubernetes.io/part-of: funnelmanager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongo-backup
subjects:
  - kind: ServiceAccount
    name: mongo-backup
