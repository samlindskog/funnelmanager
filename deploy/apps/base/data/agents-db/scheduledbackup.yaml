apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: agents-db-daily
  labels:
    app.kubernetes.io/name: agents-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  # CNPG cron has a leading seconds field: daily at 03:50.
  schedule: "0 50 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: agents-db
