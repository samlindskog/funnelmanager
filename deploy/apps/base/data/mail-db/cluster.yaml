apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mail-db
  labels:
    app.kubernetes.io/name: mail-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  # Single instance today; anti-affinity is already in place so flipping
  # instances to 2 spreads replicas across workers with no other change.
  instances: 1
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: mail-db
      app.kubernetes.io/part-of: funnelmanager
    annotations:
      # CNPG's init jobs fight sidecars (the Envoy container never exits, so
      # the bootstrap Job never completes) and the non-mesh operator must
      # reach the instance manager — same reason the identity namespace is
      # not injected. NetworkPolicies fence these pods instead.
      sidecar.istio.io/inject: "false"
  bootstrap:
    initdb:
      database: funnelmanager_mail
      owner: funnel
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity:
    nodeSelector:
      role: worker
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      # This DB is near-idle, but CNPG's default archive_timeout=5m was forcing a
      # full 16MiB WAL segment upload every 5m — ~288 mostly-EMPTY segments/day
      # (~4.6GB/day of near-zero padding) to the backups bucket. 30m cuts the
      # forced switches ~6x; wal.compression below shrinks each remaining
      # (mostly-zero) segment to a few KB. RPO becomes <=30m (fine — re-syncable).
      archive_timeout: "30min"
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://${cluster_obj_bucket_backups}/mail-db
      endpointURL: https://${cluster_obj_host}
      # Compress archived WAL + base backups. The near-empty forced segments are
      # all zeros -> gzip takes them from 16MiB to a few KB.
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: objectstore-backups
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: objectstore-backups
          key: ACCESS_SECRET_KEY
