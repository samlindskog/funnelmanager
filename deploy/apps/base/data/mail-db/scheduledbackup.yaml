apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mail-db-daily
  labels:
    app.kubernetes.io/name: mail-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  # CNPG cron has a leading seconds field: daily at 03:30.
  schedule: "0 30 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: mail-db
