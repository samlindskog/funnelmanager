apiVersion: v1
kind: Service
metadata:
  name: etcd
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: funnelmanager
spec:
  selector:
    app.kubernetes.io/name: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
      # Force plain TCP: etcd is gRPC/HTTP2, which Istio would L7-classify and
      # route through the HTTP authz branch (no JWT → denied). The OPA TCP
      # dependency-pairing branch is what authorizes milvus→etcd.
      appProtocol: tcp
