apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  labels:
    app.kubernetes.io/name: app-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  # Single instance today; anti-affinity is already in place so flipping
  # instances to 2 spreads replicas across workers with no other change.
  instances: 1
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: app-db
      app.kubernetes.io/part-of: funnelmanager
    annotations:
      # CNPG's init jobs fight sidecars (the Envoy container never exits, so
      # the bootstrap Job never completes) and the non-mesh operator must
      # reach the instance manager — same reason the identity namespace is
      # not injected. NetworkPolicies fence these pods instead.
      sidecar.istio.io/inject: "false"
  bootstrap:
    initdb:
      database: funnelmanager
      owner: funnel
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity:
    nodeSelector:
      role: worker
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      # Near-idle DB: CNPG's default archive_timeout=5m forced a full 16MiB WAL
      # segment upload every 5m (mostly-empty padding to the backups bucket). 30m
      # + wal.compression (below) cuts that WAL churn ~50x. RPO <=30m (re-syncable).
      archive_timeout: "30min"
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://${cluster_obj_bucket_backups}/app-db
      endpointURL: https://${cluster_obj_host}
      # Compress archived WAL + base backups (near-empty forced segments are all
      # zeros -> gzip shrinks 16MiB to a few KB).
      wal:
        compression: gzip
      data:
        compression: gzip
      s3Credentials:
        accessKeyId:
          name: objectstore-backups
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: objectstore-backups
          key: ACCESS_SECRET_KEY
