apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph
  labels:
    app.kubernetes.io/name: knowledge-graph
    app.kubernetes.io/part-of: funnelmanager
spec:
  selector:
    app.kubernetes.io/name: knowledge-graph
  ports:
    # Explicit TCP: Istio protocol sniffing garbles the Neo4j Bolt handshake
    # ("incomplete handshake response"); tcp-* naming + appProtocol disable it.
    - name: tcp-bolt
      appProtocol: tcp
      port: 7687
      targetPort: 7687
