apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/part-of: funnelmanager
spec:
  serviceName: milvus
  replicas: 0  # TEMP parked 2026-08-13 (operator-approved) — see leads MILVUS_URI note
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: milvus
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: milvus
      nodeSelector:
        role: worker
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.5.4
          command: ["milvus", "run", "standalone"]
          # Mirrors the compose file's seccomp:unconfined — Milvus standalone
          # trips the default runtime seccomp profile.
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: ETCD_ENDPOINTS
              value: etcd:2379
            - name: MINIO_ADDRESS
              value: minio:9000
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: access-key
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: secret-key
          ports:
            - name: grpc
              containerPort: 19530
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 3072Mi
            limits:
              # 1500m throttled bulk index builds (847m sustained observed);
              # give indexing bursts real room.
              cpu: 2500m
              # semsearch-v2 (leads_embeds_v2) holds ~3 vectors per person and the
              # corpus GROWS with every search (2026-08-11: a 30-company sweep pushed
              # the boot-time load past 6Gi -> OOM crashloop; 2560Mi and 4Gi OOMed
              # earlier at smaller sizes). 8Gi; the durable fix when this outgrows
              # again is queryNode mmap (load via page cache, not RAM).
              # 8Gi OOMed on startup WAL-replay of unsealed growing segments after a
              # bulk Prospect ingest (2026-08-12) — mmap covers sealed data only.
              memory: 10240Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
