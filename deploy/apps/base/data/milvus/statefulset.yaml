apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/part-of: funnelmanager
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: milvus
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: milvus
      nodeSelector:
        role: worker
        # Node-pinned to worker2 (2026-08-13, operator-approved migration off
        # worker1): the data PVC is local-path (node-local storage), so the pod
        # must land on the node its volume provisions on. worker2 has the RAM
        # headroom worker1 lacked for the grown leads_embeds_v2 working set.
        kubernetes.io/hostname: worker2
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.5.4
          command: ["milvus", "run", "standalone"]
          # Mirrors the compose file's seccomp:unconfined — Milvus standalone
          # trips the default runtime seccomp profile.
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: ETCD_ENDPOINTS
              value: etcd:2379
            - name: MINIO_ADDRESS
              value: minio:9000
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: access-key
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: secret-key
          ports:
            - name: grpc
              containerPort: 19530
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              # Right-sized 2026-08-14 from the 1,009-domain e2e run's monitor
              # data: internal memUsage peaked ~6.8GB / sustained ~1.4-2.3 cores
              # under bulk embed. Request ≈ sustained band so the kubelet never
              # ranks milvus first-in-line for eviction under node pressure
              # (usage/requests had hit ~330%). memory request == limit ⇒
              # Guaranteed-class for memory.
              cpu: 1500m
              memory: 8192Mi
            limits:
              # 1500m throttled bulk index builds (847m sustained observed);
              # give indexing bursts real room.
              cpu: 2500m
              # MEMORY-CAPPED design (2026-08-13/14, see milvus-config user.yaml):
              # global mmap + readAheadPolicy=random keeps resident memory
              # ~O(active pages), not O(corpus) — verified on a 1,009-domain run
              # (sawtooth 3-10.7GB working set, internal memUsage <=6.8GB, zero
              # OOM/refusals at the old 12Gi). 8Gi proved too tight for RECOVERY
              # workloads (2026-08-14 outage: post-crash reload + WAL replay +
              # compaction wedged load admission at the 0.95 watermark, ~7.7GB
              # "used" incl. page cache). 10Gi = steady-state sawtooth + recovery
              # headroom; request stays 8Gi (sustained band, eviction ranking).
              # 10Gi ALSO refused loads during the same recovery (compaction backlog
              # competes with collection load) -> back to 12Gi, the value that ran
              # the full e2e flawlessly. The cap experiment resumes only with data.
              # History of the 2.5->12Gi OOM ladder: git log this file.
              memory: 12288Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
            - name: config
              mountPath: /milvus/configs/user.yaml
              subPath: user.yaml
      volumes:
        - name: config
          configMap:
            name: milvus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
