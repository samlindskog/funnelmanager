apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: milvus
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/part-of: funnelmanager
spec:
  serviceName: milvus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: milvus
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: milvus
      nodeSelector:
        role: worker
        # Node-pinned to worker2 (2026-08-13, operator-approved migration off
        # worker1): the data PVC is local-path (node-local storage), so the pod
        # must land on the node its volume provisions on. worker2 has the RAM
        # headroom worker1 lacked for the grown leads_embeds_v2 working set.
        kubernetes.io/hostname: worker2
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.5.4
          command: ["milvus", "run", "standalone"]
          # Mirrors the compose file's seccomp:unconfined — Milvus standalone
          # trips the default runtime seccomp profile.
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: ETCD_ENDPOINTS
              value: etcd:2379
            - name: MINIO_ADDRESS
              value: minio:9000
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: access-key
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: milvus-minio
                  key: secret-key
          ports:
            - name: grpc
              containerPort: 19530
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 3072Mi
            limits:
              # 1500m throttled bulk index builds (847m sustained observed);
              # give indexing bursts real room.
              cpu: 2500m
              # semsearch-v2 (leads_embeds_v2) holds ~3 vectors per person and the
              # corpus GROWS with every search (2026-08-11: a 30-company sweep pushed
              # the boot-time load past 6Gi -> OOM crashloop; 2560Mi and 4Gi OOMed
              # earlier at smaller sizes). 8Gi; the durable fix when this outgrows
              # again is queryNode mmap (load via page cache, not RAM).
              # 8Gi OOMed on startup WAL-replay of unsealed growing segments after a
              # bulk Prospect ingest (2026-08-12) — mmap covers sealed data only.
              # 10Gi could not fully load leads_embeds_v2 (~1.15M vectors) after the
              # worker2 migration: querycoord sizes its load watermark against this
              # container limit, and 0.9*10Gi=9216Mi < the ~9.3GB predicted load, so
              # one 2.4GB sealed segment perpetually failed to load (stuck at 85%).
              # 12Gi -> watermark 11.06GB, comfortably above the prediction (worker2
              # is a 16GB node). 2026-08-13: the durable fix landed — global mmap via
              # the milvus-config user.yaml below (per-collection properties never
              # took effect for loaded segments). Once the mmap steady-state is
              # verified, this limit should come DOWN (~8Gi) to cap Milvus and
              # return headroom to the node.
              memory: 12288Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
            - name: config
              mountPath: /milvus/configs/user.yaml
              subPath: user.yaml
      volumes:
        - name: config
          configMap:
            name: milvus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
