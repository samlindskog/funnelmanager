# Distinct Service so the HTTPRoute header-match rule can target the canary
# explicitly. Its selector is `frontend-canary`, so the stable `frontend`
# Service (selector `frontend`) never picks up canary pods and vice-versa —
# this is what guarantees no routing gap on the stable path.
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  labels:
    app.kubernetes.io/name: frontend-canary
    app.kubernetes.io/part-of: funnelmanager
spec:
  selector:
    app.kubernetes.io/name: frontend-canary
  ports:
    # Conventions port 8080; stock nginx still listens on 80 (see deployment).
    - name: http
      port: 8080
      targetPort: 80
