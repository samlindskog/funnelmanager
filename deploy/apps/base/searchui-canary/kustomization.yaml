apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No serviceaccount.yaml: the canary reuses the stable `searchui` SA (defined in
# base/searchui) so its SPIFFE identity — and thus OPA's verdict — is identical
# to stable searchui. See deployment.yaml IDENTITY note.
resources:
  - deployment.yaml
  - service.yaml
