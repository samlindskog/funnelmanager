# Distinct Service so the /search/ canary HTTPRoute header-match rule can target
# the canary explicitly. Its selector is `searchui-canary`, so the stable
# `searchui` Service (selector `searchui`) never picks up canary pods and
# vice-versa — this is what guarantees no routing gap on the stable path.
apiVersion: v1
kind: Service
metadata:
  name: searchui-canary
  labels:
    app.kubernetes.io/name: searchui-canary
    app.kubernetes.io/part-of: funnelmanager
spec:
  selector:
    app.kubernetes.io/name: searchui-canary
  ports:
    # Conventions port 8080; stock nginx still listens on 80 (see deployment).
    - name: http
      port: 8080
      targetPort: 80
