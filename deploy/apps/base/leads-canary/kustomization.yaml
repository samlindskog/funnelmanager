apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No serviceaccount.yaml: the canary reuses the stable `leads` SA (defined in
# base/leads) so its SPIFFE identity — and thus OPA's verdict AND the `aud:
# leads` per-hop audience its callers exchange to — is identical to stable
# leads. Reusing the SA is REQUIRED (leads holds APOLLO_API_KEY and its inbound
# tokens carry `aud: leads`); a distinct SA/audience would fail the audience
# check. See deployment.yaml IDENTITY/TRUST MODEL notes.
resources:
  - deployment.yaml
  - service.yaml
