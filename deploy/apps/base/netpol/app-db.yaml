# app-db (CNPG Postgres): search is its only client. The CNPG operator
# (cnpg-system) needs reach-in for status/failover management, and the
# instance manager needs egress for WAL/backup shipping (barmanObjectStore
# over HTTPS) and the Kubernetes API. NetworkPolicy is layer 3 of 3 here —
# OPA pairing rules and an Istio L4 AuthorizationPolicy also apply.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-db
  labels:
    app.kubernetes.io/name: app-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  # CNPG labels instance pods with cnpg.io/cluster, not app.kubernetes.io/name.
  podSelector:
    matchLabels:
      cnpg.io/cluster: app-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search
        # The search-canary backend canary shares stable search's DB (app-db)
        # so it behaves like prod. Added explicitly (not a widened selector).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-canary
      ports:
        - protocol: TCP
          port: 5432
    # Operator reach-in: 5432 (superuser ops) + 8000 (instance manager status).
    # Without a ports: block this rule allowed cnpg-system ALL ports; the comment
    # already documents the intended two. cnpg-system is not mesh-injected, so
    # NetworkPolicy is the only gate for this peer — keep it to the two ports.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    # Backups/WAL archiving to the object store (HTTPS).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Instance manager → Kubernetes API server (leader election, status
    # patching). k3s serves the API on the node IP:6443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
