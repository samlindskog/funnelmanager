# minio (milvus segment store): milvus is its only client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: milvus
      ports:
        - protocol: TCP
          port: 9000
