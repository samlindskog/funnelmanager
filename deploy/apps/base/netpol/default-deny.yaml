# Baseline: nothing talks to anything. Every allowed flow below is an
# explicit, additive exception.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
