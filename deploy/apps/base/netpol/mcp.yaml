# mcp is internal-only: never routed from the gateway. Its sole in-cluster
# client is the agents service (the runtime AI agent acts exclusively through
# MCP tools); ingress is limited to that. The principal token rides inside the
# tool calls — OPA still gates on the calling workload identity + the
# agents->mcp exchange edge.
#
# Egress: leads, search, jobs, mail (the backends its tools front) and Keycloak. DNS via allow-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents
        # agents-canary reuses the stable agents SA/identity and drives the same
        # agents->mcp tool surface, but is a DISTINCT pod label, so mcp's ingress
        # must admit it too (mirrors keycloak-ingress + agents-db). Without this
        # the canary's MCP calls are rejected at mcp's ingress -> 503 upstream
        # connect error for http://mcp:8003/mcp.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-canary
      ports:
        - protocol: TCP
          port: 8003
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: leads
      ports:
        - protocol: TCP
          port: 8001
    # knowledge: the knowledge_* MCP tools (stable + east-west canary — the
    # marker-routed VS resolves either from the same mcp hop).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knowledge-canary
      ports:
        - protocol: TCP
          port: 8007
    # search + jobs: MCP tools call their /api/{svc}/mcp/v1/* endpoints
    # (OPA still gates on the mcp->{svc} exchange edge + workload identity).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jobs
      ports:
        - protocol: TCP
          port: 8005
    # mail: MCP mail tools call /api/mail/mcp/v1/* (mcp->mail exchange edge).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mail
      ports:
        - protocol: TCP
          port: 8004
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
