# mail: reached from the ingress gateway, mcp (mail MCP tools), and search
# (contacted-set read for exclude_contacted); talks to its own Postgres
# (mail-db) and Google APIs on 443. DNS via allow-dns. mail does NO RFC 8693
# exchange and JWT verification is done by the mesh, so it needs no Keycloak
# egress — the former identity:8080 rule was already dead at L3 (Keycloak's own
# ingress allowlist omits mail) and was removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - protocol: TCP
          port: 8004
    # mcp tools call mail's /api/mail/mcp/v1/* (OPA gates on the mcp->mail
    # exchange edge + the acting principal's mail-access grant).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp
      ports:
        - protocol: TCP
          port: 8004
    # search reads /api/mail/contacts/contacted for the exclude_contacted
    # filter (OPA gates on the search->mail exchange edge + mail-access grant).
    # search-canary shares that path, added explicitly (not a widened selector).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-canary
      ports:
        - protocol: TCP
          port: 8004
  egress:
    # CNPG labels instance pods with cnpg.io/cluster, not app.kubernetes.io/name.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mail-db
      ports:
        - protocol: TCP
          port: 5432
    # Google OAuth + Gmail REST live on the public internet.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
