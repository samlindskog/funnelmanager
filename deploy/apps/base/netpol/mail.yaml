# mail: reached only from the ingress gateway; talks to its own Postgres
# (mail-db), Keycloak, and Google APIs on 443. DNS via allow-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail
  labels:
    app.kubernetes.io/name: mail
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mail
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - protocol: TCP
          port: 8004
  egress:
    # CNPG labels instance pods with cnpg.io/cluster, not app.kubernetes.io/name.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: mail-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # Google OAuth + Gmail REST live on the public internet.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
