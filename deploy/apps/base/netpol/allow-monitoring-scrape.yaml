# Prometheus (monitoring ns) scrapes the Istio sidecar's merged-metrics
# port (15020 — app + Envoy metrics; STRICT mTLS forbids scraping the app
# ports directly) and the CNPG instance-manager metrics port (9187 — the
# db pods are not injected). The app ports stay open for completeness.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: funnelmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 9187
