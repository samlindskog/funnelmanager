# Flux reconciliation graph for the platform. Order (each stage gated on the
# previous stage's health):
#   namespaces -> cert-manager + gateway-api CRDs + CNPG operator
#             -> istio (base, istiod, edge gateway)
#             -> OPA (bundle loaded) -> mesh policies (STRICT/JWT/ext_authz)
#             -> identity (kc-db + Keycloak ready, realm imported)
#             -> gateway (certs + routes) -> observability
# Apps (apps.yaml) depend on mesh-policies + identity.
#
# The `flux-system` GitRepository + root Kustomization are created by
# `bootstrap.sh flux` (read-only deploy-key install: `flux install` + a git
# source over SSH, no repo write) — see deploy/bootstrap/README.md. Flux
# tracks `main`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-namespaces
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/namespaces
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 12h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.2.1
  ignore: |
    /*
    !/config/crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway-api-crds
  namespace: flux-system
spec:
  interval: 12h
  prune: false # never garbage-collect CRDs
  sourceRef: { kind: GitRepository, name: gateway-api }
  path: ./config/crd/standard
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-namespaces
    - name: infra-gateway-api-crds
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/cert-manager
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager-issuers
  namespace: flux-system
spec:
  # ClusterIssuers apply only after cert-manager (its CRDs + webhook) is Ready.
  dependsOn:
    - name: infra-cert-manager
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/cert-manager-issuers
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fm-cluster-vars
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cnpg-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-namespaces
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/cnpg-operator
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-istio
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cert-manager
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/istio
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-opa
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-istio
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/opa
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: opa
      namespace: opa-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-mesh-policies
  namespace: flux-system
spec:
  # Policies only after OPA is serving — CUSTOM ext_authz with a dead
  # provider would blackhole the mesh (fail closed, but avoid the outage).
  dependsOn:
    - name: infra-opa
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/mesh-policies
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-identity
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cnpg-operator
    - name: infra-istio
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/identity
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fm-cluster-vars
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keycloak
      namespace: identity
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-istio
    - name: infra-cert-manager
    - name: infra-cert-manager-issuers
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/gateway
  wait: true
---
# Grafana dashboard ConfigMaps. Separate from infra-observability ON PURPOSE:
# this path must NOT get postBuild substitution — dashboard JSON is full of
# Grafana's ${...}/$var syntax that envsubst would eat. Applied before
# infra-observability (which dependsOn it) so the grafana pod's ConfigMap
# volume mounts always resolve.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-dashboards
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-namespaces
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/observability/dashboards
  wait: true
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-namespaces
    - name: infra-dashboards
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/infrastructure/observability
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fm-cluster-vars
  wait: true
  timeout: 5m
