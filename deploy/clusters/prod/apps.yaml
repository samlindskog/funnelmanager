apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-mesh-policies
    - name: infra-identity
    - name: infra-gateway
  interval: 10m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/apps/overlays/prod
  wait: true
  timeout: 10m
  healthChecks:
    - { apiVersion: apps/v1, kind: Deployment, name: search, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: leads, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mail, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mcp, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: frontend, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mailui, namespace: prod }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  # Suspended by default: a full dev stack next to prod overcommits the
  # single 8GB worker (see the budget in bootstrap/README.md). Resume with
  # `flux resume kustomization apps-dev` when needed or once a second worker
  # joins — nothing else assumes single-worker scheduling.
  suspend: true
  dependsOn:
    - name: infra-mesh-policies
    - name: infra-identity
    - name: infra-gateway
  interval: 10m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/apps/overlays/dev
  wait: true
  timeout: 10m
