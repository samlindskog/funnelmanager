apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-mesh-policies
    - name: infra-identity
    - name: infra-gateway
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  path: ./deploy/apps/overlays/prod
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fm-cluster-vars
  wait: true
  timeout: 2m
  healthChecks:
    - { apiVersion: apps/v1, kind: Deployment, name: search, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: leads, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mail, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mcp, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: jobs, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: agents, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: frontend, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: searchui, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: mailui, namespace: prod }
    - { apiVersion: apps/v1, kind: Deployment, name: agentsui, namespace: prod }
