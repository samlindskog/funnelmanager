# FAIL-CLOSED BOOTSTRAP BUNDLE.
#
# This ConfigMap is replaced by the generated bundle from deploy/policy/
# once the Rego package lands (Phase 2 stop-gate). Until then every mesh
# request is denied — the cluster comes up dark, which is the intended
# default: no route is reachable without an explicit policy allowing it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fm-policy
  namespace: opa-system
  labels:
    app.kubernetes.io/name: opa
    app.kubernetes.io/part-of: funnelmanager
data:
  bootstrap.rego: |
    package funnelmanager.envoy

    import rego.v1

    # Placeholder until deploy/policy is approved and generated in:
    # deny everything, loudly.
    default result := {
        "allowed": false,
        "http_status": 403,
        "body": "funnelmanager policy bundle not loaded (bootstrap deny-all)",
    }
