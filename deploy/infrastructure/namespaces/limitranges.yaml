# Backstop defaults so an unannotated container never lands without
# requests/limits (every first-party manifest sets its own explicitly).
apiVersion: v1
kind: LimitRange
metadata:
  name: fm-defaults
  namespace: prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
