apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.16.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
    # Solve ACME HTTP-01 through the Gateway API listener.
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 192Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 96Mi }
    cainjector:
      resources:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 200m, memory: 192Mi }
    nodeSelector:
      role: worker
