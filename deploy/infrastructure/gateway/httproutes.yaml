# Every route the old nginx edge served, reproduced at the gateway. Routes
# live in istio-ingress and cross namespaces via backendRefs — the target
# namespaces grant that with ReferenceGrants (referencegrants.yaml).
#
# NOT routed (cluster-internal only): /api/leads/* beyond webhooks, /mcp,
# every data store, OPA. Exactly the Phase 0 classification.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-prod
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-app
  rules:
    # Apollo async webhooks — the only public leads path (secret-in-path).
    - matches:
        - path: { type: PathPrefix, value: /api/leads/webhooks/ }
      backendRefs:
        - name: leads
          namespace: prod
          port: 8001
    # Cookie-gated BACKEND search canary (Step 3b) — the browser->search hop.
    # Same secret `x-fm-canary` token + gate model as the frontend-canary "/"
    # rule below: the canary-cookie-gate EnvoyFilter always STRIPS any
    # client-supplied `x-fm-canary` header and re-injects it — set to this SAME
    # secret — ONLY when the request carries a valid `fm_canary=<secret>` cookie.
    # At the gateway the injected value IS the secret, so an Exact-secret match
    # is correct and consistent with the frontend-canary rule (and fails safe to
    # stable if the filter ever detaches — an external caller without the secret
    # cannot forge it).
    #
    # PRECEDENCE: this rule and the plain /api/search/ rule below both match the
    # same PathPrefix; the Gateway API tie-break — after (1) path length and
    # (2) method (both tie) — is (3) the number of HEADER matches: this rule has
    # one, the plain rule has zero, so this rule ALWAYS wins for correctly-marked
    # requests REGARDLESS of list order (placed first only for readability).
    # Everyone without the secret cookie falls through to stable `search`.
    # Carries the SAME 300s request timeout as the stable rule (NDJSON streams).
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
          headers:
            - name: x-fm-canary
              type: Exact
              value: "8640c2f1285bf39d0323bbe540e51694"
      backendRefs:
        - name: search-canary
          namespace: prod
          port: 8000
      timeouts:
        request: 300s # NDJSON streams
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
      backendRefs:
        - name: search
          namespace: prod
          port: 8000
      timeouts:
        request: 300s # NDJSON streams
    - matches:
        - path: { type: PathPrefix, value: /api/mail/ }
      backendRefs:
        - name: mail
          namespace: prod
          port: 8004
    # Standalone mail SPA (its nginx does the /mail/ SPA fallback).
    - matches:
        - path: { type: PathPrefix, value: /mail/ }
      backendRefs:
        - name: mailui
          namespace: prod
          port: 8080
    # Agents task API (browser-facing, like search/mail).
    - matches:
        - path: { type: PathPrefix, value: /api/agents/ }
      backendRefs:
        - name: agents
          namespace: prod
          port: 8006
    # Standalone agents SPA (its nginx does the /agents/ SPA fallback).
    - matches:
        - path: { type: PathPrefix, value: /agents/ }
      backendRefs:
        - name: agentsui
          namespace: prod
          port: 8080
    # Browser RUM ingest (Grafana Faro -> Alloy faro.receiver, monitoring ns).
    # The SPAs POST to `/telemetry/collect` (more specific than the `/` catch-all
    # so it wins), but the receiver only serves POST/OPTIONS at `/collect`, so a
    # URLRewrite rewrites `/telemetry/collect` -> `/collect` before it reaches
    # Alloy. Made anonymous by OPA (data.json routes["/telemetry/collect"]=alloy
    # + anonymous entry) on the PRE-rewrite path: Envoy's ext_authz filter runs
    # before the router applies prefix_rewrite, so OPA sees `/telemetry/collect`
    # (same as the SPA static paths — the anonymous check is on the request path
    # as the browser sends it). Alloy has no sidecar (monitoring ns) — the
    # gateway reaches it over plaintext, same as grafana.
    - matches:
        - path: { type: PathPrefix, value: /telemetry/collect }
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /collect
      backendRefs:
        - name: alloy
          namespace: monitoring
          port: 12347
    # Cookie-gated canary (Step 3a): the hub/search SPA served from the
    # `frontend-canary` workload for requests carrying the SECRET `x-fm-canary`
    # token below. Step 3a changes HOW that header is set, NOT the matched value:
    # the canary-cookie-gate EnvoyFilter (mesh-policies/canary-cookie-gate.yaml)
    # runs first on the app-host chain, always STRIPS any client-supplied
    # `x-fm-canary` header, and re-injects it — set to this SAME secret — ONLY when
    # the request carries a valid `fm_canary=<secret>` cookie. So the browser reaches
    # the canary via a host-only cookie (no CORS preflight; not sent to kc./grafana.
    # subdomains), and a client can no longer forge the header on ANY route.
    #
    # FAIL-SAFE (why the secret stays in the ROUTE, not a guessable `1`): the
    # route-match value == the EnvoyFilter-injected value == the in-manifest secret.
    # The EnvoyFilter ADDS the cookie path + strips forgeable client headers, but it
    # is NOT the sole gate. If the filter ever silently detaches (Istio upgrade
    # renames the jwt_authn anchor, gateway redeploy, reconcile lag, workloadSelector
    # drift), the route STILL requires the secret header, so an external caller
    # without the secret fails safe to stable (the pre-3a model) — never fail-open.
    # Because the matched value is unchanged from pre-3a, the EnvoyFilter is purely
    # additive: there is NO deploy-ordering hazard and no Flux dependsOn is needed.
    #
    # This rule and the `/` catch-all below both match a 1-char path ("/"), so the
    # Gateway API precedence tie-break decides between them: after (1) path length
    # and (2) method (both tie), (3) is the number of HEADER matches — this rule has
    # one, the catch-all has zero, so this rule ALWAYS wins for correctly-marked
    # requests REGARDLESS of list order (it is placed first only for readability).
    # Everyone without the secret (no valid `fm_canary` cookie) falls through to
    # stable frontend. Only the SPA-serving `/` route is duplicated; /api/* and the
    # other SPA routes are untouched, so a canary SPA's /api/* calls hit the
    # already-traced STABLE backends (the point of a frontend-only canary).
    #
    # SECURITY: reaching the canary requires the host-only `fm_canary` cookie whose
    # value is this random capability token — an unaware/induced user cannot land on
    # the canary and be served unreviewed feature-branch JS same-origin (see the
    # frontend-canary deployment.yaml trust-boundary note). To reach the canary, set
    # the cookie on x9bc433.win (no Domain attribute):
    #   document.cookie = 'fm_canary=<token>; path=/; secure; samesite=lax'
    # Rotatable by editing this value + the EnvoyFilter Lua + PLACEHOLDERS.md (all
    # three must match). See PLACEHOLDERS.md (Canary access).
    # NOTE: verify at GATE-4 that this Istio build honours the header-count
    # tie-break (Gateway API standard; Istio implements it) and that a valid cookie
    # resolves to a canary pod while an absent/wrong cookie stays stable.
    - matches:
        - path: { type: PathPrefix, value: / }
          headers:
            - name: x-fm-canary
              type: Exact
              value: "8640c2f1285bf39d0323bbe540e51694"
      backendRefs:
        - name: frontend-canary
          namespace: prod
          port: 8080
    # Hub/search SPA — catch-all last (its nginx does try_files fallback).
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          namespace: prod
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-dev
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/leads/webhooks/ }
      backendRefs:
        - name: leads
          namespace: dev
          port: 8001
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
      backendRefs:
        - name: search
          namespace: dev
          port: 8000
      timeouts:
        request: 300s
    - matches:
        - path: { type: PathPrefix, value: /api/mail/ }
      backendRefs:
        - name: mail
          namespace: dev
          port: 8004
    - matches:
        - path: { type: PathPrefix, value: /mail/ }
      backendRefs:
        - name: mailui
          namespace: dev
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: /api/agents/ }
      backendRefs:
        - name: agents
          namespace: dev
          port: 8006
    - matches:
        - path: { type: PathPrefix, value: /agents/ }
      backendRefs:
        - name: agentsui
          namespace: dev
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          namespace: dev
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-kc
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: keycloak
          namespace: identity
          port: 8080
---
# Grafana — its own host; Grafana enforces Keycloak OIDC login itself, so the
# OPA gateway policy allows this host wholesale (like the Keycloak host).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-grafana
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: grafana
          namespace: monitoring
          port: 3000
