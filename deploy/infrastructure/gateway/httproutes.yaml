# Every route the old nginx edge served, reproduced at the gateway. Routes
# live in istio-ingress and cross namespaces via backendRefs — the target
# namespaces grant that with ReferenceGrants (referencegrants.yaml).
#
# NOT routed (cluster-internal only): /api/leads/* beyond webhooks, /mcp,
# every data store, OPA. Exactly the Phase 0 classification.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-prod
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-app
  rules:
    # Apollo async webhooks — the only public leads path (secret-in-path).
    - matches:
        - path: { type: PathPrefix, value: /api/leads/webhooks/ }
      backendRefs:
        - name: leads
          namespace: prod
          port: 8001
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
      backendRefs:
        - name: search
          namespace: prod
          port: 8000
      timeouts:
        request: 300s # NDJSON streams
    - matches:
        - path: { type: PathPrefix, value: /api/mail/ }
      backendRefs:
        - name: mail
          namespace: prod
          port: 8004
    # Standalone mail SPA (its nginx does the /mail/ SPA fallback).
    - matches:
        - path: { type: PathPrefix, value: /mail/ }
      backendRefs:
        - name: mailui
          namespace: prod
          port: 8080
    # Hub/search SPA — catch-all last (its nginx does try_files fallback).
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          namespace: prod
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-dev
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-dev
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/leads/webhooks/ }
      backendRefs:
        - name: leads
          namespace: dev
          port: 8001
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
      backendRefs:
        - name: search
          namespace: dev
          port: 8000
      timeouts:
        request: 300s
    - matches:
        - path: { type: PathPrefix, value: /api/mail/ }
      backendRefs:
        - name: mail
          namespace: dev
          port: 8004
    - matches:
        - path: { type: PathPrefix, value: /mail/ }
      backendRefs:
        - name: mailui
          namespace: dev
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          namespace: dev
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-kc
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: keycloak
          namespace: identity
          port: 8080
---
# Grafana — its own host; Grafana enforces Keycloak OIDC login itself, so the
# OPA gateway policy allows this host wholesale (like the Keycloak host).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-grafana
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: grafana
          namespace: monitoring
          port: 3000
