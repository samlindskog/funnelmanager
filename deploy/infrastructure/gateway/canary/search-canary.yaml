# BACKEND search canary route (Step 3b) — "canary-if-exists-else-stable".
#
# WHY THIS IS A SEPARATE, TOGGLED FILE (the idle-canary 503 fix).
# A canary-marked `/api/search/` request must route to `search-canary` ONLY while
# that workload has healthy endpoints, and fall back to stable `search` otherwise.
# Gateway API has no health-based failover (weighted backendRefs still send their
# share to a 0-endpoint Service and 503 "no healthy upstream"), so we tie ROUTE
# PRESENCE to canary ACTIVATION instead: this route exists ⇔ `search-canary` is
# scaled up. When the canary is idle (`replicas: 0`), this file is NOT in the
# gateway kustomization `resources:` list, so the ONLY `/api/search/` route left is
# the stable one in httproutes.yaml — the `x-fm-canary` cookie is then always safe
# (it simply matches nothing canary and falls through to stable `search`).
#
# WHO TOGGLES IT (route presence == replicas, in the SAME commit):
#   * ACTIVATE  — build-canary.yml `pin` job: after flipping replicas 0→1 it adds
#                 `- canary/search-canary.yaml` to gateway/kustomization.yaml.
#   * RETIRE    — canary skill (.claude/skills/canary/canary.sh retire): after
#                 flipping replicas 1→0 it removes that line.
# Both are GitOps commits Flux reconciles; the apps + gateway kustomizations are
# separate Flux Kustomizations, so on activate the Deployment may briefly lag the
# route (transient canary-only 503 for cookie holders) and on retire the route is
# removed first — either window touches ONLY cookie-carrying operators and is
# strictly better than the permanent idle 503 this replaces.
#
# PRECEDENCE (unchanged from the old inline rule). This route's single
# `x-fm-canary` header match makes it strictly MORE specific than stable
# `/api/search/` (0 headers). Gateway API sorts ALL routes attached to a listener
# by specificity — path length, then method, then header-match count — ACROSS
# HTTPRoutes, before any per-route tie-break, and Istio implements it (verified
# live: the ingress route table is specificity-sorted, not manifest-ordered). So
# this route wins for correctly-marked requests even though it lives in its own
# HTTPRoute. If that ever regressed, it fails SAFE: the request stays on stable
# `search` (never fail-open, never 503).
#
# The secret `x-fm-canary` value is the SAME token as the canary-cookie-gate
# EnvoyFilter injects and as httproutes.yaml matched before — the gate strips any
# client-supplied header and re-injects it only for a valid host-only `fm_canary`
# cookie, so it is non-forgeable and fails safe to stable if the filter detaches.
# ROTATE the token in ALL these files that must stay byte-identical (one gateway
# route file per browser-facing canary, so this list grows as canaries are armed;
# east-west VS files stay secret-free and are NOT in this set):
#   1. deploy/infrastructure/mesh-policies/canary-cookie-gate.yaml (EnvoyFilter Lua)
#   2. deploy/infrastructure/gateway/canary/search-canary.yaml    (this file)
#   3. deploy/infrastructure/gateway/canary/frontend-canary.yaml  (sibling route)
#   4. deploy/infrastructure/gateway/canary/searchui-canary.yaml  (sibling route)
#   5. PLACEHOLDERS.md (Canary access)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search-canary
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-app
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/search/ }
          headers:
            - name: x-fm-canary
              type: Exact
              value: "8640c2f1285bf39d0323bbe540e51694"
      backendRefs:
        - name: search-canary
          namespace: prod
          port: 8000
      timeouts:
        request: 300s # NDJSON streams (matches the stable /api/search rule)
