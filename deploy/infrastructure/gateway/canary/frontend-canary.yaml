# FRONTEND (SPA) canary route (Step 3a target) — "canary-if-exists-else-stable".
#
# Same idle-canary 503 fix as canary/search-canary.yaml (read that file's header
# for the full rationale): a canary-marked `/` request routes to `frontend-canary`
# ONLY while it has healthy endpoints, else to stable `frontend`. Route PRESENCE is
# tied to canary ACTIVATION — this file is in the gateway kustomization
# `resources:` list ⇔ `frontend-canary` is scaled up. When idle, the only `/`
# route left is the stable catch-all in httproutes.yaml, so the `fm_debug` session
# cookie is always safe.
#
# WHO TOGGLES IT: build-canary.yml `pin` job adds `- canary/frontend-canary.yaml`
# on activate (replicas 0→1); the canary skill removes it on retire (replicas 1→0).
#
# PRECEDENCE: the `x-fm-canary` header match makes this route strictly more
# specific than the stable `/` catch-all (0 headers); Gateway API specificity
# ordering (verified live) puts it first across HTTPRoutes, and it fails SAFE to
# stable `frontend` if that ever regressed. Only the SPA-serving `/` route is
# duplicated for the canary — /api/* and the other SPA routes stay on the stable
# backends (the point of a frontend-only canary). The marker is the
# gateway-managed, non-forgeable `x-fm-canary` from debug-session-gate.yaml.
#
# SECURITY: reaching the canary requires the host-only `fm_debug=<secret>|canary`
# session cookie (the single value-encoded cookie whose value is the secret plus the
# `|canary` route selector — un-plantable because the selection is part of the
# secret value); the gateway strips any client-supplied `x-fm-canary` and re-injects
# the secret only for that valid cookie, so an unaware/induced user cannot be served
# unreviewed feature-branch JS same-origin. This holds WHILE the debug-session-gate
# filter is attached; the
# bounded detach failure mode (presence-match means the strip is what makes the
# marker non-forgeable) is documented in
# mesh-policies/debug-session-gate.yaml "DETACH FAILURE MODE".
#
# NO SECRET IN THIS FILE. This route PRESENCE-matches `x-fm-canary` (regex .+),
# like the east-west VS — the secret is not duplicated per route. It lives ONLY in
# the `fm-canary-token` Secret (istio-ingress), delivered to the gateway as the
# FM_CANARY_SECRET env var. Rotate = update the Secret + restart the gateway; no
# edit here (see PLACEHOLDERS.md "Debug session & canary access").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-canary
  namespace: istio-ingress
spec:
  parentRefs:
    - name: fm-gateway
      sectionName: https-app
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
          headers:
            - name: x-fm-canary
              type: RegularExpression
              value: ".+"
      backendRefs:
        - name: frontend-canary
          namespace: prod
          port: 8080
