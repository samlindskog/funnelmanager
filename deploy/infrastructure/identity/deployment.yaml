apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: funnelmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: funnelmanager
    spec:
      serviceAccountName: keycloak
      nodeSelector:
        role: edge
      tolerations:
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      containers:
        - name: keycloak
          # Pinned to a concrete 26.2.x patch + digest (verified on quay.io).
          # The script-mapper mechanism was proven on 26.2; stay on 26.2.x.
          # Bump both the tag and the digest together.
          image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
          args:
            - start
            - --import-realm
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://kc-db-rw.identity.svc:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kc-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kc-db-app
                  key: password
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: hostname
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # Enables the fm-origin-provider script mapper (mounted below), which
            # propagates the fm_origin claim across RFC 8693 token exchanges so an
            # agent-initiated origin survives every hop. 'scripts' is a preview
            # feature; `start` auto-augments the mounted provider on boot.
            - name: KC_FEATURES
              value: scripts
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Prometheus scrapes /metrics on the management port (9000).
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms256m -Xmx512m"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 640Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # Script provider JAR (subPath keeps the image's providers/ dir
            # intact and only adds this one file).
            - name: providers
              mountPath: /opt/keycloak/providers/fm-origin-provider.jar
              subPath: fm-origin-provider.jar
              readOnly: true
      volumes:
        - name: realm-import
          secret:
            secretName: keycloak-realm
        - name: providers
          configMap:
            name: keycloak-providers
