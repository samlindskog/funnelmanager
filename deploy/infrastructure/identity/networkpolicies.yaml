apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: identity
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - port: 8080
          protocol: TCP
    # Backchannel token endpoint: search/mcp/agents/jobs exchange or mint tokens
    # against keycloak.identity directly (split-horizon FM_OIDC_TOKEN_URL) —
    # the public issuer URL is not reachable from the app namespaces'
    # default-deny egress. search/mcp do RFC 8693 exchange; agents does the
    # agents->mcp exchange; jobs uses client_credentials for its service-account
    # identity plus jobs->producer exchange.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
          podSelector:
            matchExpressions:
              # The *-canary backends run the same RFC 8693 exchanges as their
              # stable peers (search-canary: search->leads; agents-canary: the
              # agents->mcp exchange), so they need the Keycloak backchannel too.
              # Each canary label is added explicitly — a canary reuses its
              # stable peer's SA/audience but is a DISTINCT pod label, so it is
              # not covered by the stable entry and must be listed here or its
              # token exchange is REJECTed at Keycloak's ingress (connection
              # refused), even though its own egress policy permits the hop.
              - key: app.kubernetes.io/name
                operator: In
                values: [search, search-canary, mcp, agents, agents-canary, jobs, knowledge, knowledge-canary]
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scrapes the management interface (metrics) on 9000.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-egress
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kc-db
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kc-db-ingress
  namespace: identity
  labels:
    app.kubernetes.io/name: kc-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kc-db
  policyTypes:
    - Ingress
  ingress:
    # Only Keycloak may reach Postgres
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 5432
          protocol: TCP
    # CNPG operator management (status probes, switchover, backups)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Prometheus scrapes the CNPG instance-manager metrics port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kc-db-egress
  namespace: identity
  labels:
    app.kubernetes.io/name: kc-db
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kc-db
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Object storage (WAL archiving / base backups) on 443; 6443 lets the
    # CNPG instance manager report status to the kube-apiserver.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
