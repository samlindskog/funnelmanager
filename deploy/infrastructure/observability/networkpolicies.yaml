# monitoring namespace network policy: default-deny both directions, then
# narrow allows. Note: node-exporter runs WITHOUT hostNetwork (prometheus.yaml
# — the node ufw rejects node-IP scrapes), so its pods ARE subject to these
# policies: scrape ingress is admitted by allow-prometheus-scrape-ingress and
# additionally by the explicit node-exporter rule below (load-bearing if the
# catch-all is ever narrowed). The API-server egress rule uses an ipBlock
# because the k3s apiserver endpoint is a node IP, not a pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# All monitoring pods may resolve DNS via kube-system (CoreDNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Prometheus (kubernetes_sd), Fluent Bit (kubernetes filter) and
# kube-state-metrics all need the kube-apiserver (node IP:6443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prometheus
          - fluent-bit
          - kube-state-metrics
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
---
# Prometheus scrapes targets in every namespace (any TCP port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress-scrape
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
---
# Scrape targets inside monitoring (loki, kube-state-metrics, grafana, ...)
# must also admit Prometheus on the ingress side of default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
---
# node-exporter scrape ingress, explicitly. Today the catch-all
# allow-prometheus-scrape-ingress (podSelector {}) also covers this; this
# named rule exists so narrowing that catch-all can never silently kill the
# node metrics (node-exporter is pod-networked here — see prometheus.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter-ingress-prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9100
---
# Loki and Tempo both push blocks to Linode Object Storage over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objectstore-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - loki
          - tempo
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# objstore-metrics CronJob egress: Linode Object Storage over HTTPS (mirrors
# objectstore-egress) to `mc du` both buckets, plus the pushgateway (:9091) to
# POST the measured metrics. DNS is covered by allow-dns-egress (podSelector {}).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: objstore-metrics-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: objstore-metrics
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-pushgateway
      ports:
        - protocol: TCP
          port: 9091
---
# pushgateway ingress: pushes from the objstore-metrics CronJob and scrapes
# from Prometheus, both on :9091. The catch-all allow-prometheus-scrape-ingress
# (podSelector {}) already admits the Prometheus scrape; this explicit rule
# exists so a future narrowing of that catch-all can never silently break the
# push OR the scrape of the pushgateway (same intent as node-exporter-ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pushgateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: objstore-metrics
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-egress-loki
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
---
# Loki ingress: log pushes from Fluent Bit + Alloy (browser RUM), queries from
# Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - fluent-bit
                  - alloy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3100
---
# Tempo ingress: OTLP/gRPC spans (:4317) from the mesh Envoy sidecars in the
# prod + gateway + control-plane namespaces, and query traffic (:3100) from
# Grafana. dev is intentionally excluded (no dev/prod trace co-mingling; dev
# isn't deployed). Prometheus scrape ingress is covered by
# allow-prometheus-scrape-ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
  ingress:
    # OTLP/gRPC spans from the mesh sidecars (prod + gateway + control-plane)
    # and from Alloy in this namespace (browser traces via faro.receiver).
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - prod
                  - istio-ingress
                  - istio-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - protocol: TCP
          port: 3100
    # Keycloak OIDC (server-side token/userinfo) over the public issuer on 443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress-grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# Admin access to Grafana arrives via the istio-ingress gateway (route added
# with the gateway config later; the policy is in place now).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - protocol: TCP
          port: 3000
---
# Alloy ingress: browser RUM (Grafana Faro) arrives via the ingress gateway on
# the faro.receiver port only. `/collect` is routed here by the app HTTPRoute;
# the receiver's own rate limiter + payload cap bound this public endpoint. The
# Alloy UI/metrics port (12345) is intentionally NOT admitted here — Prometheus
# scrape ingress (allow-prometheus-scrape-ingress) covers metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-ingress-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - protocol: TCP
          port: 12347
---
# Alloy egress: fan browser telemetry out to Tempo (OTLP/gRPC :4317) and Loki
# (push :3100), both in this namespace. DNS is covered by allow-dns-egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-egress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
      ports:
        - protocol: TCP
          port: 3100
