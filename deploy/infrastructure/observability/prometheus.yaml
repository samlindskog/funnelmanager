# Prometheus single server (no alertmanager). The pushgateway IS enabled — it
# is the sink for the objstore-metrics CronJob (objstore-metrics.yaml), which
# measures the two Linode buckets every 30m and pushes fm_objstore_bucket_*.
# Envoy sidecars are scraped by the chart's default kubernetes-pods job
# (prometheus.io/scrape annotations) — no extra config needed for them here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus
      version: "27.5.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    alertmanager:
      enabled: false
    # Capacity alerting rules (Phase 4 of the 2026-08-13/14 milvus memory-capping
    # program). NOTE: alertmanager is disabled, so these fire visibly in
    # Prometheus/Grafana (`ALERTS{}` series, alert list panels) but are NOT
    # delivered anywhere — attaching a delivery channel is a separate decision.
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: funnelmanager-capacity
            rules:
              # The memory-capped milvus design keeps resident ~O(active pages);
              # sustained working-set near the (now 8Gi) limit means the model is
              # being outgrown — check "OOM if load"/write-denial log lines and
              # the runbook before raising anything.
              - alert: MilvusMemoryNearLimit
                expr: >-
                  container_memory_working_set_bytes{namespace="prod",pod="milvus-0",container="milvus"}
                    / on(namespace,pod,container)
                  kube_pod_container_resource_limits{namespace="prod",pod="milvus-0",container="milvus",resource="memory"}
                  > 0.92
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "milvus-0 working set >92% of its memory limit for 15m"
                  description: "The mmap'd memory-capped design should sawtooth well below the limit; sustained pressure means load refusals / write throttling are imminent. Runbook: docs/ops-runbook.md (Milvus memory model)."
              # mmap trades RAM for disk: the corpus now grows the node
              # filesystem (~84GB for the 2026-08-14 1,009-domain run).
              - alert: NodeRootDiskHigh
                expr: >-
                  1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                    / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                  > 0.80
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Node root filesystem >80% full for 30m"
                  description: "Milvus mmap + MinIO segments + Mongo payloads grow disk with corpus size. Check per-run growth and prune/expand before 90%. Runbook: docs/ops-runbook.md (Milvus memory model)."
    prometheus-pushgateway:
      # Sink for the objstore-metrics CronJob (measure bucket size/count ->
      # push every 30m). fullnameOverride pins the Service to
      # `prometheus-pushgateway`; the chart default would be the doubled
      # `prometheus-prometheus-pushgateway` (release name + subchart name),
      # which would break the scrape target + netpol selectors below. The
      # `app.kubernetes.io/name: prometheus-pushgateway` pod label is
      # unaffected by fullnameOverride, so netpol selectors stay stable.
      enabled: true
      fullnameOverride: prometheus-pushgateway
      nodeSelector:
        role: worker
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    kube-state-metrics:
      enabled: true
      nodeSelector:
        role: worker
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    prometheus-node-exporter:
      enabled: true
      # NOT hostNetwork: with it (the chart default) the scrape target is the
      # node's public IP:9100, which every node's ufw (default-deny incoming,
      # deploy/bootstrap/bootstrap.sh) rejects — all four targets sat at up=0.
      # Without hostNetwork the exporter gets a pod IP and the scrape rides
      # the pod network (already ufw-allowed), no per-node firewall change
      # needed. Host CPU/mem/disk/fs stats still come from the /host/proc +
      # /host/sys hostPath mounts; only the netdev collector now sees the pod
      # netns — node NETWORK panels read cAdvisor's root cgroup (id="/")
      # instead (see the k8s-cluster dashboard).
      hostNetwork: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: role
          operator: Equal
          value: edge
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

    server:
      retention: 7d
      nodeSelector:
        role: worker
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      service:
        type: ClusterIP

    extraScrapeConfigs: |
      - job_name: istiod
        metrics_path: /metrics
        static_configs:
          - targets:
              - istiod.istio-system.svc:15014

      - job_name: keycloak
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - identity
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: keycloak
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: $$1:9000
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: opa
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - opa-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: opa
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: cnpg
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - prod
                - identity
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            regex: (.+)
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: $$1:9187
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cnpg_cluster
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # The objstore-metrics CronJob pushes fm_objstore_bucket_bytes/_objects
      # here (job/objstore-size). honor_labels: true is REQUIRED so the pushed
      # bucket/role labels — and the pushgateway-synthesized job="objstore-size"
      # — survive verbatim instead of being overwritten by this scrape job's
      # own job/instance target labels. The dashboard keys purely on role/bucket.
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets:
              - prometheus-pushgateway.monitoring.svc:9091

      # No custom job for the fm services: STRICT mTLS rejects direct scrapes
      # of the app ports from this (non-mesh) namespace. Their deployments
      # carry prometheus.io annotations instead — Istio's metrics merge
      # rewrites them to the sidecar's plaintext :15020 (app + Envoy metrics
      # together) and the chart's default kubernetes-pods job scrapes that.
