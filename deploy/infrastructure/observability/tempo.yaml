# Tempo single-binary: local 5Gi PVC is the WAL/cache; trace blocks live in
# Linode Object Storage (bucket funnelmanager-2, prefix `tempo/` — reuses the
# same bucket + `objectstore-loki` credentials as loki.yaml; see PLACEHOLDERS.md).
# Receives OTLP/gRPC spans on :4317 (chart-default receiver) from the mesh
# Envoy sidecars (Istio Telemetry -> provider `tempo`); serves the query API on
# :3100 (chart default `tempo.server.http_listen_port`) to Grafana.
# NOTE: the chart's Service also exposes the other default receiver ports
# (jaeger/zipkin/opencensus/otlp-http); they are unreachable — the
# `tempo-ingress` NetworkPolicy admits only :4317 (mesh) and :3100 (Grafana).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    tempo:
      # Disable usage phone-home (matches loki self-monitoring off).
      reportingEnabled: false
      retention: 168h
      storage:
        trace:
          backend: s3
          s3:
            bucket: funnelmanager-2
            prefix: tempo
            endpoint: us-lax-4.linodeobjects.com
            region: us-lax-4
      # Bound shared-bucket cost + forged-span flood surface (single tenant).
      overrides:
        defaults:
          ingestion:
            rate_limit_bytes: 15000000
            burst_size_bytes: 20000000
            max_traces_per_user: 10000
          global:
            max_bytes_per_trace: 5000000
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # S3 creds via the minio-go AWS env fallback — same secret Loki uses.
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: objectstore-loki
              key: ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: objectstore-loki
              key: ACCESS_SECRET_KEY

    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    nodeSelector:
      role: worker
