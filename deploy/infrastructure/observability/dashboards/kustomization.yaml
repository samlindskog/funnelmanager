# Grafana dashboards-as-code. The *.json here is GENERATED by generate.py —
# edit that and re-run it; never hand-edit the JSON.
#
# This directory is applied by its OWN Flux Kustomization (infra-dashboards)
# deliberately WITHOUT postBuild substitution: dashboard JSON is full of
# Grafana's ${__value...}/$__rate_interval/$var syntax, which envsubst would
# eat (the parent observability Kustomization substitutes from fm-cluster-vars
# and needs its $ escaped as $$). Keep dashboards out of substituted paths.
#
# Grafana (stateless, no PVC) mounts these ConfigMaps via dashboardProviders /
# dashboardsConfigMaps in grafana.yaml — one ConfigMap per Grafana folder.
# Names are load-bearing: grafana.yaml references them literally.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs:
      app.kubernetes.io/part-of: funnelmanager
configMapGenerator:
  - name: grafana-dashboards-fm
    options:
      disableNameSuffixHash: true
    files:
      - fm-platform-overview.json
      - fm-service-drilldown.json
      - fm-canary.json
      - fm-logs.json
      - fm-traces.json
      - fm-rum.json
  - name: grafana-dashboards-k8s
    options:
      disableNameSuffixHash: true
    files:
      - k8s-cluster.json
      - k8s-pods.json
  - name: grafana-dashboards-infra
    options:
      disableNameSuffixHash: true
    files:
      - istio-mesh.json
      - identity-policy.json
      - cnpg-postgres.json
