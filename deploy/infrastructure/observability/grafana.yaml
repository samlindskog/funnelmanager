# Grafana: stateless (no persistence — datasources AND dashboards are
# provisioned; anything clicked together in the UI dies with the pod), admin
# creds from the bootstrap-provided `grafana-admin` Secret. ClusterIP only;
# exposed later via the ingress gateway.
#
# Dashboards are generated + packed into the grafana-dashboards-* ConfigMaps
# by deploy/infrastructure/observability/dashboards/ (its own Flux
# Kustomization, infra-dashboards, applied WITHOUT postBuild substitution so
# Grafana's $-syntax survives). Each provider below maps one ConfigMap to one
# Grafana folder.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "8.10.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    nodeSelector:
      role: worker

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

    persistence:
      enabled: false

    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    service:
      type: ClusterIP
      port: 3000

    # Keycloak OIDC login (generic_oauth). The browser is sent to the public
    # issuer (kc.x9bc433.win); Grafana's own server-side token/userinfo calls
    # go back out over 443 to the same public host (issuer stays consistent).
    # The client secret arrives as the GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET env
    # var (Grafana's native [auth.generic_oauth].client_secret override) from
    # the `grafana-oidc` Secret; the `grafana` confidential client + redirect
    # URI live in the realm export.
    envFromSecret: grafana-oidc
    grafana.ini:
      server:
        root_url: https://grafana.x9bc433.win
      auth:
        disable_login_form: false
        oauth_auto_login: false
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        client_id: grafana
        scopes: openid profile roles
        auth_url: https://kc.x9bc433.win/realms/funnelmanager/protocol/openid-connect/auth
        token_url: https://kc.x9bc433.win/realms/funnelmanager/protocol/openid-connect/token
        api_url: https://kc.x9bc433.win/realms/funnelmanager/protocol/openid-connect/userinfo
        login_attribute_path: preferred_username
        # Keycloak has no /userinfo/emails endpoint; without an email claim
        # Grafana would 404 on that GitHub-style fallback. Derive the "email"
        # from a claim that is always present so login never hits it.
        email_attribute_path: "email || preferred_username"
        # Map realm role -> Grafana org role. admin => Grafana Admin.
        role_attribute_path: "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'"
        role_attribute_strict: false
        allow_assign_grafana_admin: true
        use_pkce: true

    sidecar:
      dashboards:
        enabled: false
      datasources:
        enabled: false

    # File-provisioned dashboards (dashboards-as-code). allowUiUpdates stays
    # off: with no persistence a UI edit would silently die with the pod —
    # the generator in dashboards/ is the only source of truth.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: funnelmanager
            orgId: 1
            folder: Funnel Manager
            type: file
            disableDeletion: false
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/funnelmanager
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: infrastructure
            orgId: 1
            folder: Infrastructure
            type: file
            disableDeletion: false
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/infrastructure
    dashboardsConfigMaps:
      funnelmanager: grafana-dashboards-fm
      kubernetes: grafana-dashboards-k8s
      infrastructure: grafana-dashboards-infra

    testFramework:
      enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc
            isDefault: true
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki.monitoring.svc:3100
            jsonData:
              # Extract the 32-hex trace id from the W3C `traceparent`
              # (00-<traceid>-<spanid>-<flags>) the JSON logs carry
              # (fm_runtime logging.py) and link the log line to Tempo.
              derivedFields:
                - name: TraceID
                  matcherRegex: '"traceparent":\s*"00-([0-9a-f]{32})'
                  url: '$${__value.raw}'
                  datasourceUid: tempo
          - name: Tempo
            type: tempo
            uid: tempo
            access: proxy
            url: http://tempo.monitoring.svc:3100
            jsonData:
              # trace -> its logs (Loki). tracesToMetrics + nodeGraph are
              # omitted: both need Tempo's metrics-generator/service-graph
              # (not wired here) and would render empty panels.
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: '-1h'
                spanEndTimeShift: '1h'
                filterByTraceID: true
                filterBySpanID: false
