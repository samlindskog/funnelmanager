# Manual gateway deployment (chart `gateway`) pinned to the edge node.
# Publicly exposed via hostPorts 80/443 on `edge` only — k3s servicelb and
# traefik are disabled, so nothing else binds public ports anywhere.
# The Gateway API resource (infrastructure/gateway) attaches to this
# deployment via spec.addresses -> the Service hostname.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingress
  namespace: istio-ingress
spec:
  interval: 30m
  dependsOn:
    - name: istiod
      namespace: istio-system
  chart:
    spec:
      chart: gateway
      version: "1.24.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
  values:
    name: istio-ingress
    replicaCount: 1
    service:
      # No LoadBalancer: exposure is hostPort on the edge node (patched below).
      type: ClusterIP
      ports:
        - name: http
          port: 80
          targetPort: 80
        - name: https
          port: 443
          targetPort: 443
    nodeSelector:
      role: edge
    tolerations:
      - key: role
        operator: Equal
        value: edge
        effect: NoSchedule
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: istio-ingress
            # container 0 is the `istio-proxy` (Envoy) — same container the ports
            # patch below targets. The chart renders NO `env:` list on this
            # container (verified live: containers[0].env is absent), so we SET
            # the whole array (like the ports patch does) rather than append with
            # `/env/-` — an append to a missing array would fail the postRender and
            # break the front-door reconcile. If the chart ever ships its own env
            # entries, switch this to a strategic-merge (merge by name).
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/ports
                value:
                  - containerPort: 80
                    hostPort: 80
                    protocol: TCP
                  - containerPort: 443
                    hostPort: 443
                    protocol: TCP
                  - containerPort: 15090
                    protocol: TCP
                    name: http-envoy-prom
              # Debug-session (fm_debug) secret, delivered from the `fm-canary-token`
              # Secret (istio-ingress ns, key `token`) as env var FM_CANARY_SECRET.
              # The Secret + env var keep their bootstrap names DELIBERATELY (a
              # rename would leave the gateway referencing a nonexistent Secret until
              # bootstrap recreates it); the value is the fm_debug session secret.
              # The debug-session-gate EnvoyFilter Lua reads it via os.getenv — the
              # secret is NO LONGER hardcoded in any manifest. Rotate by updating
              # the Secret and `kubectl rollout restart` this Deployment.
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                  - name: FM_CANARY_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: fm-canary-token
                        key: token
