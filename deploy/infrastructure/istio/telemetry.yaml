# Mesh-wide telemetry. Living in the mesh root namespace (istio-system) with no
# selector, this Telemetry applies to every workload in the mesh.
#
# tracing: each Envoy emits one span per hop to the `tempo` opentelemetry
# extensionProvider (helm.yaml meshConfig). Spans are already correlated by the
# W3C `traceparent` fm_runtime propagates across every RFC 8693 exchange hop.
# randomSamplingPercentage is 5 (see below): mesh-wide baseline is telemetry-
# LIGHT — prod emits only a thin ~5% forensic trace sample (logs still flow via
# Loki, metrics via Prometheus), while CANARY flows stay fully traced.
#
# accessLogging: keeps the built-in `envoy` file logger (/dev/stdout, the
# meshConfig format with query-strip) but attaches a CEL filter that SUPPRESSES
# access logs for the Apollo webhook path. That path carries a long-lived secret
# IN THE PATH itself (not the query), so query-stripping cannot help — the whole
# log line must be dropped. Mesh-wide is deliberate: the ingress gateway routes
# /api/leads/webhooks/ to leads with NO path rewrite, so BOTH the gateway Envoy
# and the leads sidecar see the secret-bearing path; one mesh-wide filter covers
# both without enumerating workload labels.
# CEL semantics (the filter is "log when TRUE"):
#   - raw TCP conn (leads<->mongo/milvus, *<->*-db): no HTTP request, so
#     has(request.url_path) is false -> inner && is false -> !false = TRUE -> log.
#     The has() guard is REQUIRED: Istio applies accessLogging filters to TCP
#     chains too (AccessLogBuilder.setTCPAccessLog), and Envoy's CEL filter
#     fails closed on an evaluation error (a bare request.url_path on a TCP conn
#     would error -> drop -> silently kill EVERY TCP access log mesh-wide).
#   - normal HTTP: has()=true, prefix false -> !(true && false) = TRUE -> log.
#   - webhook HTTP: has()=true, prefix true -> !(true && true) = FALSE -> dropped.
# (Chosen over an EnvoyFilter: an EnvoyFilter MERGE on the HCM `access_log`
# repeated field APPENDS a second logger — the original unfiltered logger would
# still emit the secret. The Telemetry filter is the supported suppressor.)
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: funnelmanager
spec:
  accessLogging:
    - providers:
        - name: envoy
      filter:
        expression: '!(has(request.url_path) && request.url_path.startsWith("/api/leads/webhooks/apollo/"))'
  tracing:
    - providers:
        - name: tempo
      # 5 = telemetry-light prod baseline. Envoy's random sampler starts a new
      # trace for only ~5% of unmarked prod traffic — an always-on forensic
      # trail for incident debugging, kept low so Tempo stays light (Loki logs +
      # Prometheus metrics are unaffected). Canary flows are still FULLY traced
      # (not just 5%) WITHOUT a per-workload override: the canary SPA's Faro
      # bootstrap originates a `traceparent` with the sampled flag SET, and every
      # Istio sidecar HONORS an incoming sampled decision end-to-end — including
      # any stable pod a canary request fans out to (Istio's default
      # sampling respects an already-sampled parent rather than re-rolling it).
      # So a header-routed canary request is captured across every hop regardless
      # of the 5% baseline. NOTE: this honor-incoming-sampled behavior is the
      # load-bearing assumption of the whole light-baseline design — VERIFY IT
      # LIVE at the canary promotion gate (a canary request must yield a complete
      # multi-hop trace in Tempo while ambient prod traffic is only ~5% sampled).
      randomSamplingPercentage: 5
      # SECURITY: overwrite Envoy's built-in `http.url` span tag with a literal
      # so the full path+query never lands in Tempo. That URL would otherwise
      # leak the Apollo webhook path-secret (/api/leads/webhooks/apollo/{secret})
      # and the mail OAuth `state`/`code` query params at 100% sampling.
      # customTags are applied after built-in tags (setTag overwrite semantics),
      # so the literal replaces the URL. Route/method/status tags are untouched.
      customTags:
        http.url:
          literal:
            value: redacted
# CANARY trace-sampling. Baseline is a thin 5% above, and canary flows are
# captured FULLY (not just 5%) WITHOUT a per-workload override: the canary SPA's Faro build originates a
# sampled `traceparent` from the browser and every sidecar honors that incoming
# decision (see the randomSamplingPercentage comment). No namespaced Telemetry
# selecting the canary workload is needed, and it would NOT help anyway — Istio's
# random sampler acts on the ROOT decision only, so a per-workload override
# cannot retro-sample a request whose parent arrived unsampled. If a future need
# arises to force-sample a fraction of AMBIENT prod traffic, raise the baseline
# here rather than adding a workload override.
