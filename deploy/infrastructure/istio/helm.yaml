apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 1h
  url: https://istio-release.storage.googleapis.com/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: base
      version: "1.24.3"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    defaultRevision: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 30m
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.24.3"
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    pilot:
      # istiod lives on the control-plane node.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits: { cpu: 1000m, memory: 1Gi }
    global:
      # Sidecars sized small — ~20 injected pods must fit the worker budget.
      proxy:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
      # Envoy waits for the proxy before app containers start — required for
      # STRICT mTLS + fail-closed ext_authz correctness on cold starts.
      proxy_init:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        holdApplicationUntilProxyStarts: true
      # Every request is authorized by OPA via Envoy ext_authz. The Service
      # has internalTrafficPolicy: Local, so each Envoy talks to the OPA
      # instance on its own node (the OPA DaemonSet covers all three nodes).
      extensionProviders:
        - name: opa-ext-authz
          envoyExtAuthzGrpc:
            service: opa.opa-system.svc.cluster.local
            port: 9191
