# Canary cookie gate (Step 3a of the full-stack canary program).
#
# WHAT THIS DOES. Each active canary has a dedicated HTTPRoute
# (gateway/canary/<svc>-canary.yaml — present only while that canary is scaled up)
# that routes its path (`/` for frontend, `/api/search/` for search, …) to the
# `<svc>-canary` workload when the request carries the SECRET `x-fm-canary` token.
# The browser must be able to reach the canary WITHOUT sending that header
# itself: a header on `/api/*` rides cross-origin to Keycloak, triggering a CORS
# preflight that breaks browser token refresh — and a client-set header is
# forgeable. This Lua HTTP filter changes the header into a gateway-managed signal:
#   - It ALWAYS removes any inbound (client-supplied) `x-fm-canary` request header,
#     so the header is never client-forgeable on ANY route (`/`, `/api/*`, SPAs).
#   - It re-injects `x-fm-canary: <secret>` ONLY when the request carries a
#     host-only cookie `fm_canary=<secret>`. A cookie triggers no preflight and is
#     host-scoped (no Domain attribute -> not sent to kc./grafana. subdomains).
# The SECRET capability token is NO LONGER hardcoded here. It lives in ONE place:
# the `fm-canary-token` Secret (istio-ingress ns, key `token`), delivered to this
# gateway's Envoy container as the env var FM_CANARY_SECRET (see
# infrastructure/istio/gateway-deployment.yaml); the Lua reads it via
# os.getenv("FM_CANARY_SECRET"). The canary routes no longer carry the secret —
# they PRESENCE-match `x-fm-canary` (regex .+), exactly like the east-west VS —
# so an external caller cannot forge the marker (the gate strips any client-set
# `x-fm-canary` and re-injects the secret only for a valid cookie). Rotate by
# updating the Secret + `kubectl rollout restart` the gateway; no manifest edit.
#
# FAIL-SAFE (this runs on EVERY front-door request). If FM_CANARY_SECRET is unset
# or empty the filter degrades safely: it NEVER injects `x-fm-canary`, `/canary/on`
# redirects to `/` WITHOUT setting a cookie, and it never errors or interrupts the
# request — normal traffic simply flows to stable. The client-`x-fm-canary`-strip
# stays UNCONDITIONAL while the filter is attached.
#
# DETACH FAILURE MODE — HONEST ACCOUNTING (why the old "never fail-open" claim no
# longer holds for the gateway class). The canary HTTPRoutes now PRESENCE-match
# `x-fm-canary` (regex .+) instead of the literal secret, because the secret was
# moved out of git into the fm-canary-token Secret and Gateway API cannot match a
# Secret-delivered value. Consequence: if this filter ever silently DETACHES (Istio
# upgrade renames the jwt_authn anchor, gateway redeploy, reconcile lag,
# workloadSelector drift) it stops stripping the client header too — so a
# client-supplied `x-fm-canary: anything` would then reach route matching and steer
# to the canary. This is a real narrowing vs. the old exact-secret route floor
# (which required a client to already KNOW the secret). It is accepted because the
# blast radius is bounded and shallow:
#   * it can route to a canary ONLY while that canary is ACTIVE (the route file
#     exists only then — "canary-if-exists-else-stable"); idle = no route, nothing
#     to fail open TO;
#   * reaching a canary pod is NOT an authz bypass — the canary enforces the SAME
#     Keycloak/OPA auth as stable; an anonymous caller still gets 401/login;
#   * `x-fm-canary` is telemetry-only, NEVER an authz input (OPA never inspects it);
#   * a browser CANNOT be induced to send `x-fm-canary` cross-origin (forbidden
#     header / CORS), so the "trick a victim onto canary JS" vector stays closed —
#     only a caller issuing their OWN request can reach the canary this way.
# So detach degrades to "an attacker can reach trusted, login-gated, feature-branch
# code while a canary happens to be active," not to any privilege gain. The
# mesh-internal east-west VS (leads) presence-matches too but carries no detach risk
# at all — it is not internet-reachable. Keeping canaries retired when idle keeps
# this window closed by default.
#
# The secret now rides `x-fm-canary` internally (it is in fm_runtime TRACE_HEADERS,
# propagated east-west). Acceptable: mTLS mesh, never logged (context.py repr=False,
# step-1 presence-only telemetry), same containment class as a Bearer token.
#
# WHY EARLY (INSERT_BEFORE jwt_authn). Inserting ahead of `jwt_authn` guarantees
# the header is canonicalized (stripped, then conditionally re-added) BEFORE auth
# and BEFORE route matching, so route selection sees only the gateway-set value
# and the client can never influence it. It runs before ext_authz too, so this is
# NOT an authz decision (OPA does not inspect `x-fm-canary`) — canary routing is
# a pure traffic-splitting concern.
#
# WHY AN ENVOYFILTER + SNI SCOPE. Mirrors grafana-jwt-exemption.yaml: match key is
# our OWN stable SNI hostname (`x9bc433.win`, the app host) plus Envoy's stable
# filter constants — no Gateway-API-generated route/vhost name is referenced.
# Scope is one workload (the edge gateway) and one filter chain (the app host);
# the kc./grafana. chains and the :80 redirect are untouched.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: canary-cookie-gate
  namespace: istio-ingress
spec:
  workloadSelector:
    # The istio-ingress gateway pod (chart selector `istio: <name trimPrefix
    # "istio-">` -> `istio: ingress`), same as grafana-jwt-exemption.yaml.
    labels:
      istio: ingress
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            # ONLY the app host's TLS filter chain (its own x9bc433.win cert).
            sni: x9bc433.win # PLACEHOLDERS.md (App host)
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                # Insert immediately before the RequestAuthentication's jwt_authn
                # so the marker is fixed before auth + routing.
                name: envoy.filters.http.jwt_authn
      patch:
        operation: INSERT_BEFORE
        value:
          name: canary-cookie-gate
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                -- Make `x-fm-canary` a gateway-managed, non-forgeable marker,
                -- PLUS expose server-side cookie toggle endpoints /canary/on|off.
                -- Fails SAFE: no cookie / absent / wrong value -> no header set
                -- -> request stays on stable frontend. The secret is never
                -- logged. On a valid cookie the secret is injected as
                -- `x-fm-canary`; the canary routes presence-match (regex .+), so
                -- any injected value routes the marked request to the canary.
                --
                -- The secret comes from the FM_CANARY_SECRET env var (from the
                -- fm-canary-token Secret) via os.getenv, read PER REQUEST. If it
                -- is nil or empty the filter fails safe: no inject, /canary/on
                -- sets no cookie, and the request is never errored/interrupted.

                -- Extract query param `key` from a raw query string (the text
                -- AFTER "?"), exact-matching the param NAME. This is why `t` is
                -- never confused with `foot`, nor with some OTHER param whose
                -- VALUE merely contains the token as a substring. nil if absent.
                function fm_query_param(query, key)
                  for pair in string.gmatch(query, "([^&]+)") do
                    local eq = string.find(pair, "=", 1, true)
                    if eq ~= nil then
                      local name = string.sub(pair, 1, eq - 1)
                      if name == key then
                        return string.sub(pair, eq + 1)
                      end
                    end
                  end
                  return nil
                end

                function envoy_on_request(request_handle)
                  local headers = request_handle:headers()
                  -- The ONE secret local, reused by both the toggle endpoints
                  -- and the strip/inject below (no second copy of the token).
                  -- Read from the gateway's environment (fm-canary-token Secret ->
                  -- FM_CANARY_SECRET env). os.getenv returns nil if the var is
                  -- unset; treat nil OR empty as "no secret" and fail SAFE.
                  local secret = os.getenv("FM_CANARY_SECRET")
                  local have_secret = (secret ~= nil) and (secret ~= "")

                  -- ===== Server-side cookie toggle endpoints (short-circuit) ====
                  -- These run at the TOP of the request phase, BEFORE the
                  -- strip/inject below and BEFORE jwt_authn/OPA/routing (this
                  -- filter is INSERT_BEFORE jwt_authn). /canary/on|off are answered
                  -- ENTIRELY by this Lua local reply and never reach jwt_authn,
                  -- OPA/ext_authz, or the app -- they are pure cookie-setters, so
                  -- bypassing authz for exactly these two paths is correct and
                  -- intended. The cookie is set SERVER-SIDE here, hence HttpOnly:
                  -- JS cannot read it, closing the XSS-harvest exposure the earlier
                  -- document.cookie approach had. Secure + SameSite=Lax retained.
                  local method = headers:get(":method")
                  local path = headers:get(":path")
                  if method == "GET" and path ~= nil then
                    -- Split off any query string, then EXACT-match the path so
                    -- `/canary/onx` does NOT match `/canary/on`.
                    local base = path
                    local query = ""
                    local qpos = string.find(path, "?", 1, true)
                    if qpos ~= nil then
                      base = string.sub(path, 1, qpos - 1)
                      query = string.sub(path, qpos + 1)
                    end
                    if base == "/canary/on" then
                      -- Fail CLOSED: set the cookie ONLY when `t` EXACTLY equals
                      -- the secret AND the request is a top-level navigation; a
                      -- missing/wrong `t` OR a non-navigation still redirects to
                      -- `/` but sends NO Set-Cookie (never sets the cookie).
                      --
                      -- Navigation guard: `/canary/on` is a state-changing GET, so
                      -- someone WITH the secret could try a drive-by plant of the
                      -- cookie on a victim via `<img src=".../canary/on?t=...">`
                      -- (SameSite=Lax stops the cookie being SENT cross-site, not
                      -- being SET by such a subresource load). A subresource carries
                      -- `Sec-Fetch-Dest: image`/`script`/`empty`/`iframe`; a real
                      -- top-level navigation (the launcher's 302 or clicking the
                      -- link) carries `Sec-Fetch-Dest: document`. Sec-Fetch-* are
                      -- browser-set FORBIDDEN headers -> page JS / cross-origin
                      -- fetch cannot forge them. Absent => older browser that omits
                      -- Sec-Fetch-* entirely -> allow (the exact-`t` + SameSite=Lax
                      -- still gate it). Present-and-not-"document" => refuse, closing
                      -- the forced-canary CSRF-style vector.
                      local dest = headers:get("sec-fetch-dest")
                      local nav = (dest == nil) or (dest == "document")
                      local t = fm_query_param(query, "t")
                      -- `have_secret` guards TWO things: (1) with no secret we
                      -- must set no cookie (fail safe), and (2) it prevents the
                      -- nil==nil trap — if secret is nil and `t` is absent (also
                      -- nil), `t == secret` would be TRUE and the concat below
                      -- would error on a nil. Requiring have_secret closes both.
                      if nav and have_secret and t == secret then
                        request_handle:respond(
                          {[":status"] = "302",
                           ["location"] = "/",
                           ["set-cookie"] = "fm_canary=" .. secret ..
                             "; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Lax"},
                          "")
                      else
                        request_handle:respond(
                          {[":status"] = "302", ["location"] = "/"},
                          "")
                      end
                      return
                    end
                    if base == "/canary/off" then
                      -- Clear the cookie (Max-Age=0) and redirect home.
                      request_handle:respond(
                        {[":status"] = "302",
                         ["location"] = "/",
                         ["set-cookie"] = "fm_canary=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax"},
                        "")
                      return
                    end
                  end

                  -- ===== Strip (UNCONDITIONAL) + conditional inject ============
                  -- Untrusted: strip any client-supplied marker from the request
                  -- HEADERS (header phase; routing resolves from the header block).
                  -- This runs REGARDLESS of whether a secret is configured, so a
                  -- client can never smuggle in `x-fm-canary`.
                  headers:remove("x-fm-canary")
                  -- Fail SAFE: with no configured secret, never inject the marker.
                  if not have_secret then
                    return
                  end
                  local cookie = headers:get("cookie")
                  if cookie == nil then
                    return
                  end
                  -- Split the Cookie header on ";" and exact-match the cookie
                  -- NAME `fm_canary` (not a substring of another cookie).
                  for pair in string.gmatch(cookie, "([^;]+)") do
                    local kv = string.gsub(pair, "^%s*(.-)%s*$", "%1")
                    local eq = string.find(kv, "=", 1, true)
                    if eq ~= nil then
                      local name = string.sub(kv, 1, eq - 1)
                      local value = string.sub(kv, eq + 1)
                      if name == "fm_canary" and value == secret then
                        headers:add("x-fm-canary", secret)
                        return
                      end
                    end
                  end
                end
