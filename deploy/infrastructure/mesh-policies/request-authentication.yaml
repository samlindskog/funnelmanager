# JWT validation. The gateway validates end-user tokens at the edge; every
# sidecar validates again (exchanged per-hop tokens included). Tokens are
# FORWARDED to the app so fm_runtime can hand the principal to handlers and
# use it as the RFC 8693 subject for the next hop.
#
# A RequestAuthentication only *validates present* tokens; rejection of
# token-less requests is the DENY policy in authorization-policies.yaml.
#
# NOTE: the istio-ingress RA below has NO selector, so its jwt_authn filter is
# installed on EVERY gateway listener — including grafana.x9bc433.win, which
# self-authenticates and must accept an opaque (non-JWT) Grafana SA bearer.
# Istio 1.24.3 RA targetRefs cannot scope OFF a single listener (no
# sectionName), so grafana-jwt-exemption.yaml surgically removes jwt_authn from
# ONLY the grafana SNI filter chain. Keep the two in sync if the RA is
# re-scoped or the grafana host changes.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: istio-ingress
spec:
  jwtRules:
    - issuer: https://kc.x9bc433.win/realms/funnelmanager # PLACEHOLDERS.md
      jwksUri: https://kc.x9bc433.win/realms/funnelmanager/protocol/openid-connect/certs
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt
  namespace: prod
spec:
  jwtRules:
    - issuer: https://kc.x9bc433.win/realms/funnelmanager
      jwksUri: https://kc.x9bc433.win/realms/funnelmanager/protocol/openid-connect/certs
      forwardOriginalToken: true
