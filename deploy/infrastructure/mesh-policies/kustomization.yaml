apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - peer-authentication.yaml
  - request-authentication.yaml
  - authorization-policies.yaml
  - grafana-jwt-exemption.yaml
  # App-host gateway Lua filter (was `canary-cookie-gate`): strips client-supplied
  # `x-fm-canary` and re-adds `x-fm-canary: <secret>` only for a valid `fm_debug`
  # session cookie WITH the `fm_route=canary` selector; also gates prod tracing on
  # `fm_debug` and serves the `/debug/*` cookie-toggle endpoints (SNI-scoped like
  # the grafana filter above). Makes the canary marker trustworthy for each active
  # canary's route (gateway/canary/<svc>-canary.yaml).
  - debug-session-gate.yaml
  - canary/leads-canary-eastwest.yaml
  # EAST-WEST canary VirtualServices — "canary-if-exists-else-stable" for
  # INTERNAL hops (the in-mesh analogue of the gateway/canary/<svc>-canary.yaml
  # HTTPRoutes). Each `canary/<svc>-canary-eastwest.yaml` splits an internal
  # host on `x-fm-canary` PRESENCE (regex, never the secret value). It is listed
  # here ⇔ that `<svc>-canary` Deployment is scaled up (VS presence == canary
  # activation): a VS present while the canary is idle (replicas: 0) would 503
  # marked traffic, so an idle canary has NO VS and the marker falls through to
  # the stable Service.
  #
  # MANAGED TOGGLE (no longer a manual GitOps edit): the canary tooling now owns
  # these east-west lines exactly like the gateway canary routes.
  # build-canary.yml's `pin` job ADDs `- canary/<svc>-canary-eastwest.yaml` here
  # (anchored on the `- debug-session-gate.yaml` resource line above) in the same
  # commit that activates an internal canary (leads/mcp/jobs, replicas 0->1), and
  # `.claude/skills/canary/canary.sh retire` REMOVEs it when it scales back to 0.
  # leads-canary is ACTIVE in git today, so its east-west VS
  # (`- canary/leads-canary-eastwest.yaml`) IS listed above — VS present ⇔ canary
  # active; the tooling removes the line on retire.
