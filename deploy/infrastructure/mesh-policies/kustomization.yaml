apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - peer-authentication.yaml
  - request-authentication.yaml
  - authorization-policies.yaml
  - grafana-jwt-exemption.yaml
  # App-host gateway Lua filter: strips client-supplied `x-fm-canary` and re-adds
  # `x-fm-canary: <secret>` only for a valid `fm_canary` cookie (SNI-scoped like
  # the grafana filter above). Makes the canary marker trustworthy for each active
  # canary's route (gateway/canary/<svc>-canary.yaml).
  - canary-cookie-gate.yaml
