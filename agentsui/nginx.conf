server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app is built with base /agents/ and always served under that prefix
    # (the main frontend nginx proxies /agents/ here with the path intact).
    location = / {
        return 302 /agents/;
    }

    location /agents/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /agents/ {
        try_files $uri $uri/ /agents/index.html;
    }
}
